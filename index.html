 $('#nav').innerHTML=tabs.map(function(x){return '<button class="'+(view==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+t(x[1])+'</button>'}).join('');
 var b=$('#bar');b.style.display=(view=='sell'&&cnt())?'flex':'none';
 b.innerHTML='<span>'+cnt()+t('itm')+' · '+t('view')+'</span><span>'+$$(calc().t)+'</span>';
 $('#m').innerHTML=view=='sell'?vSell():view=='hist'?vHist():view=='prod'?vProd():vSet();
}
function go(v){view=v;edit=null;arm=0;render();scrollTo(0,0)}
function flt(){return P.filter(function(p){return(cat=='All'||p.cat==cat)&&(p.name+' '+(p.bn||'')).toLowerCase().indexOf(q.toLowerCase())>-1})}
function vSell(){
 var cats=['All'].concat(P.map(function(p){return p.cat}).filter(function(c,i,a){return c&&a.indexOf(c)==i}));
 var l=flt();
 return '<input id="sq" placeholder="'+t('search')+'" value="'+esc(q)+'" oninput="q=this.value;keep()"><div class="cats">'+cats.map(function(c){return '<button class="'+(c==cat?'on':'')+'" onclick="cat=\''+esc(c)+'\';render()">'+esc(c=='All'?t('all'):tc(c))+'</button>'}).join('')+'</div>'
 +(P.length?'<div class="grid" id="gr">'+gridHtml(l)+'</div>':'<div class="empty">'+t('noItems')+'</div>');
}
function gridHtml(l){return l.map(function(p){var out=p.stock!==''&&p.stock<=0,low=p.stock!==''&&p.stock<=5,n=cart[p.id]||0;
 return '<button class="p" '+(out?'disabled':'')+' onclick="add('+p.id+')">'+(n?'<div class="qty">'+n+'</div>':'')+'<div class="dot" style="background:hsl('+hue(p.name)+',45%,40%)">'+esc((nm(p)||'?').charAt(0).toUpperCase())+'</div><b>'+esc(nm(p))+'</b><span>'+$$(p.price)+'</span>'+(p.stock!==''?'<small style="'+(low?'color:var(--warn)':'')+'">'+(out?t('out'):p.stock+t('left'))+'</small>':'')+'</button>'}).join('')}
function keep(){var g=$('#gr');if(g)g.innerHTML=gridHtml(flt())}
function add(id){var p=gp(id),n=(cart[id]||0)+1;if(p.stock!==''&&n>p.stock)return;cart[id]=n;render()}
function chg(id,d){var p=gp(id),n=(cart[id]||0)+d;if(n<=0)delete cart[id];else if(p.stock===''||n<=p.stock)cart[id]=n;render();openCart()}
function rm(id){delete cart[id];render();openCart()}
function cancelOrder(){cart={};disc='';recv='';render();openCart()}
function openCart(){
 var ids=Object.keys(cart);if(!ids.length){$('#cs').classList.remove('show');return}
 var c=calc(),h='<h2 style="margin:0 0 6px">'+t('order')+'</h2>';
 ids.forEach(function(id){var p=gp(id);h+='<div class="row"><div><b>'+esc(nm(p))+'</b><div class="mute">'+$$(p.price)+' × '+cart[id]+' = '+$$(p.price*cart[id])+'</div></div><div class="q"><button onclick="chg('+id+',-1)">−</button><b>'+cart[id]+'</b><button onclick="chg('+id+',1)">+</button><button class="x" aria-label="'+t('rm')+'" onclick="rm('+id+')">✕</button></div></div>'});
 h+='<label>'+t('disc')+' ('+esc(S.cur)+')</label><input type="number" inputmode="decimal" value="'+esc(disc)+'" onchange="disc=this.value;openCart();render()">'
 +'<div class="tot" style="margin-top:12px"><span>'+t('sub')+'</span><span>'+$$(c.s)+'</span></div>'+(c.d?'<div class="tot"><span>'+t('disc')+'</span><span>−'+$$(c.d)+'</span></div>':'')+(+S.tax?'<div class="tot"><span>'+t('tax')+' '+S.tax+'%</span><span>'+$$(c.tx)+'</span></div>':'')
 +'<div class="tot g"><span>'+t('total')+'</span><span>'+$$(c.t)+'</span></div><label>'+t('pay')+'</label><select onchange="pay=this.value;openCart()">'+['Cash','Card','Mobile'].map(function(x){return '<option value="'+x+'"'+(x==pay?' selected':'')+'>'+t(x)+'</option>'}).join('')+'</select>';
 if(pay=='Cash'){var ch=(+recv||0)-c.t;h+='<label>'+t('recv')+'</label><input type="number" inputmode="decimal" value="'+esc(recv)+'" onchange="recv=this.value;openCart()">'+(recv!==''?'<div class="tot"><span>'+t('chg')+'</span><b>'+(ch>=0?$$(ch):t('short')+$$(-ch))+'</b></div>':'')}
 h+='<div style="display:flex;gap:10px;margin-top:16px"><button class="bad" onclick="cancelOrder()">'+t('cancel')+'</button><button class="pri" style="flex:1" onclick="charge()">'+t('charge')+' '+$$(c.t)+'</button></div><button style="width:100%;margin-top:10px" onclick="$(\'#cs\').classList.remove(\'show\')">'+t('keep')+'</button>';
 $('#cb').innerHTML=h;$('#cs').classList.add('show');
}
function charge(){
 var c=calc(),items=[];
 for(var id in cart){var p=gp(id);items.push({id:p.id,name:p.name,bn:p.bn,price:p.price,qty:cart[id]});if(p.stock!=='')p.stock-=cart[id]}
 var no=(H.length?H[H.length-1].no:1000)+1;
 var s={no:no,t:Date.now(),items:items,sub:c.s,disc:c.d,tax:c.tx,total:c.t,pay:pay,recv:pay=='Cash'&&recv!==''?+recv:null};
 H.push(s);save();cSale(s);cart={};disc='';recv='';$('#cs').classList.remove('show');render();showRc(s.no);
}
function rcText(s){
 var L=[S.shop,t('rn')+s.no,new Date(s.t).toLocaleString(),'--------------------------------'];
 s.items.forEach(function(i){L.push((S.lang=='bn'&&i.bn?i.bn:i.name)+'\n   '+i.qty+' × '+i.price.toFixed(2)+'  =  '+(i.qty*i.price).toFixed(2))});
 L.push('--------------------------------',t('sub')+': '+$$(s.sub));
 if(s.disc)L.push(t('disc')+': −'+$$(s.disc));if(s.tax)L.push(t('tax')+': '+$$(s.tax));
 L.push(t('total')+': '+$$(s.total),t('paid')+': '+t(s.pay));
 if(s.recv!=null)L.push(t('received')+': '+$$(s.recv),t('chg')+': '+$$(s.recv-s.total));
 L.push('',t('thanks'));return L.join('\n');
}
function showRc(no){var s=H.find(function(h){return h.no==no});vArm=0;
 $('#rb').innerHTML='<pre>'+esc(rcText(s))+'</pre><div style="display:flex;gap:10px;margin-top:12px"><button style="flex:1" onclick="share('+no+')">'+t('share')+'</button><button style="flex:1" onclick="window.print()">'+t('print')+'</button><button class="pri" style="flex:1" onclick="$(\'#rc\').classList.remove(\'show\')">'+t('done')+'</button></div><button class="bad" id="vb" style="width:100%;margin-top:10px" onclick="voidSale('+no+')">'+t('void')+'</button>';
 $('#rc').classList.add('show');
}
function voidSale(no){if(!vArm){vArm=1;$('#vb').textContent=t('void2');return}
 var s=H.find(function(h){return h.no==no});
 s.items.forEach(function(i){var p=i.id?gp(i.id):P.find(function(x){return x.name==i.name});if(p&&p.stock!=='')p.stock+=i.qty});
 H=H.filter(function(h){return h.no!=no});save();cDel(no);$('#rc').classList.remove('show');render();toast(t('voided'))}
function share(no){var s=H.find(function(h){return h.no==no}),x=rcText(s);try{if(navigator.share)return navigator.share({text:x});navigator.clipboard.writeText(x);toast(t('csvok'))}catch(e){}}
function vHist(){
 var td=H.filter(function(h){return isToday(h.t)}),tot=td.reduce(function(a,h){return a+h.total},0),by={},top={};
 td.forEach(function(h){by[h.pay]=(by[h.pay]||0)+h.total;h.items.forEach(function(i){var k=S.lang=='bn'&&i.bn?i.bn:i.name;top[k]=(top[k]||0)+i.qty})});
 var tl=Object.keys(top).sort(function(a,b){return top[b]-top[a]}).slice(0,3).map(function(k){return esc(k)+' ×'+top[k]}).join(', ');
 var h='<div class="stats"><div class="box"><span class="mute">'+t('tsales')+'</span><b>'+$$(tot)+'</b></div><div class="box"><span class="mute">'+t('orders')+'</span><b>'+td.length+'</b></div></div><div class="box mute">'+(Object.keys(by).map(function(k){return t(k)+': '+$$(by[k])}).join(' · ')||t('nosale'))+(tl?'<br>'+t('top')+': '+tl:'')+'</div><button style="width:100%" onclick="csv()">'+t('csv')+'</button><div class="box">';
 h+=H.length?H.slice().reverse().slice(0,100).map(function(s){return '<div class="row" onclick="showRc('+s.no+')"><div><b>#'+s.no+'</b> <span class="mute">'+new Date(s.t).toLocaleString()+'</span><div class="mute">'+s.items.length+t('itm')+' · '+t(s.pay)+'</div></div><b>'+$$(s.total)+'</b></div>'}).join(''):'<div class="empty">'+t('hist0')+'</div>';
 return h+'</div>';
}
function csv(){var r=['no,date,items,subtotal,discount,tax,total,payment'];H.forEach(function(s){r.push([s.no,new Date(s.t).toISOString(),'"'+s.items.map(function(i){return i.qty+'x '+i.name}).join('; ').replace(/"/g,'""')+'"',s.sub,s.disc,s.tax,s.total,s.pay].join(','))});
 try{navigator.clipboard.writeText(r.join('\n'));toast(t('csvok'))}catch(e){toast(t('csvno'))}}
function vProd(){
 var e=edit?gp(edit):null;
 var h='<div class="box"><b>'+(e?t('edit'):t('add'))+'</b><label>'+t('nm')+'</label><input id="pn" value="'+esc(e?e.name:'')+'"><label>'+t('nb')+'</label><input id="pb" value="'+esc(e?e.bn||'':'')+'"><label>'+t('pr')+'</label><input id="pp" type="number" inputmode="decimal" value="'+(e?e.price:'')+'"><label>'+t('cat')+'</label><input id="pc" value="'+esc(e?e.cat:'')+'" placeholder="Drinks"><label>'+t('stock')+'</label><input id="ps" type="number" inputmode="numeric" value="'+(e?e.stock:'')+'">'
 +'<div style="display:flex;gap:10px;margin-top:14px"><button class="pri" style="flex:1" onclick="saveP()">'+t('save')+'</button>'+(e?'<button class="bad" onclick="delP()">'+t('del')+'</button><button onclick="edit=null;render()">'+t('back')+'</button>':'')+'</div></div><div class="box">';
 h+=P.map(function(p){return '<div class="row" onclick="edit='+p.id+';render();scrollTo(0,0)"><div><b>'+esc(nm(p))+'</b><div class="mute">'+esc(p.cat?tc(p.cat):t('noc'))+(p.stock!==''?' · '+p.stock:'')+'</div></div><b>'+$$(p.price)+'</b></div>'}).join('');
 return h+'</div>';
}
function saveP(){var n=$('#pn').value.trim(),b=$('#pb').value.trim(),pr=parseFloat($('#pp').value);if(!(n||b)||isNaN(pr)){toast(t('need'));return}
 var o={name:n||b,bn:b,price:pr,cat:$('#pc').value.trim(),stock:$('#ps').value===''?'':+$('#ps').value};
 if(edit)Object.assign(gp(edit),o);else{o.id=Date.now();P.push(o)}
 edit=null;save();render()}
function delP(){P=P.filter(function(p){return p.id!=edit});delete cart[edit];edit=null;save();render()}
function vSet(){return '<div class="box"><label>'+t('lang')+'</label><div class="lg" style="width:max-content"><button class="'+(S.lang=='bn'?'on':'')+'" onclick="setLang(\'bn\')">বাংলা</button><button class="'+(S.lang=='en'?'on':'')+'" onclick="setLang(\'en\')">English</button></div><label>'+t('shop')+'</label><input value="'+esc(S.shop)+'" onchange="S.shop=this.value;save();render()"><label>'+t('cur')+'</label><input value="'+esc(S.cur)+'" onchange="S.cur=this.value;save();render()"><label>'+t('taxp')+'</label><input type="number" inputmode="decimal" value="'+S.tax+'" onchange="S.tax=+this.value||0;save();render()"></div><div class="box"><b>'+t('data')+'</b><p class="mute">'+esc(CE||'')+'</p><button onclick="FB.out()">'+L('লগআউট','Log out')+'</button><p class="mute">'+t('note')+'</p><button class="bad" onclick="wipe()">'+(arm?t('erase2'):t('erase'))+'</button></div>'}
function wipe(){if(!arm){arm=1;render();return}H.forEach(function(s){cDel(s.no)});H=[];arm=0;save();render()}
render();boot();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
if(!/PASTE/.test(window.FIREBASE_CONFIG.apiKey)){
 const app=initializeApp(window.FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);let un=[];
 const ref=(c,i)=>doc(db,'users',auth.currentUser.uid,c,i);
 window.FB={
  watch:cb=>onAuthStateChanged(auth,cb),
  login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
  reset:e=>sendPasswordResetEmail(auth,e),
  stop:()=>{un.forEach(f=>f());un=[]},
  out:()=>{window.FB.stop();return signOut(auth)},
  set:(c,i,d)=>setDoc(ref(c,i),JSON.parse(JSON.stringify(d))),
  del:(c,i)=>deleteDoc(ref(c,i)),
  listen:(c,cb,er)=>un.push(onSnapshot(collection(db,'users',auth.currentUser.uid,c),cb,er))
 };
}
if(window.onFB)window.onFB();
</script></body></html>
