 else{var k=Math.min(1,size/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.drawImage(im,0,0,c.width,c.height)}
 cb(c.toDataURL('image/jpeg',q))};im.onerror=function(){toast(L('ছবি পড়া যায়নি','Could not read image'))};im.src=r.result};r.readAsDataURL(file)}

function otpPhone(){var x=otpCur(),d=x.d,e=$('#otph'),p=(e?e.value:d.phone||'').trim();
 if(p.replace(/\D/g,'').length<8){toast(L('সঠিক ফোন নম্বর দিন','Enter a valid phone number'));return null}
 if(d.id!==undefined&&d.phone!==p){d.phone=p;dusave()}return p}
function otpIntl(p){var n=String(p).replace(/\D/g,'');return n.length>=10&&n.charAt(0)!='5'||String(p).trim().charAt(0)=='+'||n.indexOf('00')==0||n.indexOf('880')==0}

function otpOk(){var o=otpS,c=otpCur().c,v=($('#otpin').value||'').trim();
 if(!c.pc&&Date.now()>o.exp){otpFresh();toast(L('কোডের মেয়াদ শেষ, নতুন কোড পাঠান','Code expired, send a new one'));otpView();return}
 if(v!==o.code){o.tries++;if(o.tries>=5){otpFresh();toast(c.pc?L('পাঁচবার ভুল, লিংকে নতুন কোড বসেছে','Five wrong tries, the link now shows a new code'):L('পাঁচবার ভুল, নতুন কোড বানানো হয়েছে','Five wrong tries, new code made'));otpView()}else{toast(L('কোড মেলেনি, আবার দিন','Code does not match'));$('#otpin').value=''}return}
 o.done[c.id]=v;o.i++;
 if(o.i<o.q.length){o.qr=false;otpFresh();otpView();return}
 otpDone=o.done;otpPass=true;otpS=null;closeDs();window.charge()}

function errMsg(x){var c=(x&&x.code)||'';
 if(/invalid-credential|wrong-password|user-not-found/.test(c))return L('ইমেইল বা পাসওয়ার্ড ভুল','Wrong email or password');
 if(/email-already/.test(c))return L('এই ইমেইলে একাউন্ট আছে, লগইন করুন','Account exists, please log in');
 if(/weak-password/.test(c))return L('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন','Password needs 6+ characters');
 if(/invalid-email/.test(c))return L('ইমেইলটি সঠিক নয়','Invalid email');
 if(/network/.test(c))return L('ইন্টারনেট নেই','No internet');
 return c||String((x&&x.message)||x||'Error')
}

function doAuth(n){var e=$('#le').value.trim(),p=$('#lp').value;
 if(!e||!p){showLogin(L('ইমেইল ও পাসওয়ার্ড দিন','Enter email and password'),e);return}
 document.querySelectorAll('#lb button').forEach(function(x){x.disabled=true});
 $('#lb').insertAdjacentHTML('afterbegin','<p style="font-weight:700;text-align:center">'+L('অপেক্ষা করুন…','Please wait…')+'</p>');
 var to=setTimeout(function(){showLogin(L('সাড়া নেই। ইন্টারনেট বা অ্যাড-ব্লকার দেখুন','No response. Check internet or ad-blocker'),e)},15000);
 try{FB[n?'signup':'login'](e,p).then(function(){clearTimeout(to)}).catch(function(x){clearTimeout(to);showLogin(errMsg(x),e)})}catch(x){clearTimeout(to);showLogin(String(x),e)}

 var loc=H.filter(function(x){return x.lc});if(loc.length)H=H.filter(function(x){return !x.lc});
 if(snap.metadata.fromCache&&!l.length){H=H.concat(loc);lsave();render();return}

 upl=true;H=l.sort(function(a,b){return a.no-b.no});

<script>
var PATCH_V='p2';
(function(){
if(typeof PUBR!=='undefined'&&PUBR)return;
try{
var LS_OK='pos_rp_ok',LS_DEAD='pos_rq_dead',BATCH=40,ST={msg:'',chk:'',verify:false};
function lget(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function good(x){return '<b style="color:var(--ac)">'+x+'</b>'}
function bad(x){return '<b style="color:var(--warn)">'+x+'</b>'}
function stamp(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

/* ---------- সারি (queue) ---------- */
window.rqSet=function(q){var ok=lset('pos_rq',q);if(!ok)toast(L('⚠ ফোনের জায়গা ভর্তি, সারি সেভ হয়নি','⚠ Storage full, queue not saved'));return ok};

/* বিক্রির স্থায়ী আইডি (rid): অফলাইনে করা বিক্রির নম্বর পরে বদলালেও শিটে বাতিল ঠিক ধরা পড়বে */
var _rqSale=rqSale;

var _charge=charge;
window.charge=function(){var n=H.length;_charge.apply(this,arguments);if(H.length>n)lsave()};
var _vr=null;
window.rqAdd=function(ev){if(!rpOn())return;if(ev&&ev.k=='void'&&_vr!=null)ev.id=_vr;var q=rqGet();q.push(ev);rqSet(q);rqFlush()};
var _void=voidSale;
window.voidSale=function(no){var s=H.find(function(h){return h.no==no});_vr=(s&&s.rid)?s.rid:null;try{_void(no)}finally{_vr=null}};

/* হিস্ট্রি কাজ: বিক্রিগুলো সারিতে আলাদা আলাদা না রেখে একটা "কাজ" হিসেবে রাখা হয়, ৪০টা করে ব্যাচে যায় */
function selSales(j){return H.filter(function(s){var d=day(s.t);return j.day?d==j.day:j.month?d.slice(0,7)==j.month:true}).sort(function(a,b){return a.t-b.t||a.no-b.no})}

/* ---------- পাঠানো ---------- */
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({name:'AbortError'})},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
function post(ev){
 var url=S.rp.url,body=JSON.stringify({token:(S.rp||{}).token||'',ev:ev}),hd={'Content-Type':'text/plain;charset=utf-8'};
 var need=ev.k=='batch'||ev.k=='stat'||ev.k=='month';
 return withTimeout(fetch(url,{method:'POST',headers:hd,body:body}).then(function(r){return r.text()}),45000).then(function(tx){
  tx=(tx||'').trim();
  if(tx=='bad token')return{fatal:true,msg:L('✗ গোপন কোড মেলেনি। অ্যাপ আর স্ক্রিপ্টের কোড হুবহু এক করুন','✗ Secret code does not match')};
  if(tx.charAt(0)=='<')return{fatal:true,msg:L('✗ Deploy-এ Who has access = Anyone দিয়ে New version করে Deploy করুন','✗ Deploy as "Anyone" and publish a new version')};
  if(need&&tx=='ok')return{fatal:true,msg:L('✗ স্ক্রিপ্ট পুরনো। নতুন daily-report কোড বসিয়ে New version Deploy করুন','✗ Script is old. Paste the new script and deploy a new version')};
  if(tx=='ok'||tx.indexOf('ok:')==0)return{ok:true,txt:tx};
  return{err:true,msg:tx.slice(0,80)||'empty'};
 }).catch(function(e){
  if(e&&e.name=='AbortError')return{net:true,msg:L('সাড়া আসেনি (৪৫ সেকেন্ড)','No response (45s)')};
  return withTimeout(fetch(url,{method:'POST',mode:'no-cors',headers:hd,body:body}),45000).then(function(){return{ok:true,unv:true,txt:''}}).catch(function(e2){return{net:true,msg:L('নেট বা সংযোগ সমস্যা','Network problem')}});
 });
}

var busy=false,fails=0;
function fin(){busy=false;rpShow()}
function bump(id,n){var q=rqGet();if(q[0]&&q[0].id==id){q[0].from=(q[0].from||0)+n;rqSet(q)}}
function dropHead(h){var q=rqGet();if(q.length&&JSON.stringify(q[0])==JSON.stringify(h)){q.shift();rqSet(q)}}
function toDead(ev){var d=lget(LS_DEAD,[]);d.push(ev);lset(LS_DEAD,d)}
window.rqFlush=function(){if(!rpOn()||busy||!navigator.onLine)return;if(!rqGet().length){rpShow();return}busy=true;step()};
function step(){
 var q=rqGet();
 if(!q.length){if(ST.verify){ST.verify=false;rpCheck(true)}fin();return}
 var h=q[0],ev,done,n=1;
 if(h.k=='hist'){
  var list=selSales(h),from=h.from||0;
  if(from>=list.length){q.shift();rqSet(q);ST.msg=good('✓ '+L('হিস্ট্রি পাঠানো শেষ','History upload finished'))+' · '+stamp();step();return}
  if(h.single){ev=rqSale(list[from]);done=function(){bump(h.id,1)}}
  else{var part=list.slice(from,from+BATCH);n=part.length;ev={k:'batch',list:part.map(function(s){return rqSale(s)}),shop:S.shop,cur:S.cur};done=function(){bump(h.id,part.length)}}
 }else{ev=h;done=function(){dropHead(h)}}
 post(ev).then(function(r){
  if(r.ok){fails=0;done();lset(LS_OK,Date.now());
   ST.msg=good('✓ '+(h.k=='hist'?n+L(' টি বিক্রি শিটে গেছে',' sales sent'):L('পাঠানো হয়েছে','Sent')))+(r.unv?' <span class="mute">'+L('(নিশ্চিত নয়, "শিট যাচাই" চাপুন)','(unconfirmed, press Check sheet)')+'</span>':'')+' · '+stamp();
   rpShow();step();return}
  if(r.fatal){ST.msg=bad(r.msg);fin();return}
  if(r.net){ST.msg=bad(L('✗ ','✗ ')+r.msg)+' <span class="mute">'+L('১ মিনিট পরে নিজে আবার চেষ্টা হবে','will retry in 1 minute')+'</span>';fin();return}
  fails++;
  if(h.k=='hist'&&!h.single){var q2=rqGet();if(q2[0]&&q2[0].id==h.id){q2[0].single=true;rqSet(q2)}fails=0;ST.msg=bad('✗ '+esc(r.msg))+' · '+L('একটা একটা করে পাঠানো হচ্ছে','sending one by one');rpShow();setTimeout(step,800);return}
  if(fails>=3){toDead(ev);if(h.k=='hist')bump(h.id,1);else dropHead(h);fails=0;ST.msg=bad('✗ '+esc(r.msg))+' · '+L('একটা ইভেন্ট ব্যর্থ তালিকায় গেছে','one event moved to failed list');rpShow();step();return}
  ST.msg=bad('✗ '+esc(r.msg));rpShow();setTimeout(step,1500);
 });
}

  else if(r.ok&&r.unv)ST.chk=L('যাচাই করা যায়নি (ব্রাউজার উত্তর পড়তে দিচ্ছে না)','Could not verify (browser blocked the reply)');

window.rpRetry=function(){var d=lget(LS_DEAD,[]);if(!d.length)return;var q=rqGet();d.forEach(function(e){q.push(e)});rqSet(q);lset(LS_DEAD,[]);rqFlush();rpShow()};
window.rpClr=function(){rqSet([]);lset(LS_DEAD,[]);ST.msg='';ST.chk='';render()};

function statusHtml(){
 var q=rqGet(),dead=lget(LS_DEAD,[]),ok=lget(LS_OK,0),h='';
 if(!rpOn())h+='<div>'+L('চালু করে URL দিলে রিপোর্ট কাজ করবে।','Turn it on and add the URL.')+'</div>';
 if(ST.msg)h+='<div>'+ST.msg+'</div>';
 if(ST.chk)h+='<div style="margin-top:4px">'+ST.chk+'</div>';
 var pend=0,jt=0,jd=0;q.forEach(function(e){if(e.k=='hist'){jt+=e.total||0;jd+=Math.min(e.from||0,e.total||0)}else pend++});
 if(jt){var pc=Math.round(jd/jt*100);h+='<div style="margin-top:6px">'+L('বিক্রি পাঠানো: ','Sales sent: ')+jd+' / '+jt+'<div style="height:8px;background:var(--line);border-radius:6px;margin-top:4px"><div style="height:8px;width:'+pc+'%;background:var(--ac);border-radius:6px"></div></div></div>'}
 if(pend)h+='<div>'+L('অন্য ইভেন্ট বাকি: ','Other events waiting: ')+pend+'</div>';
 if(dead.length)h+='<div style="color:var(--warn)">'+L('ব্যর্থ: ','Failed: ')+dead.length+' <button class="lk" onclick="rpRetry()">'+L('আবার পাঠান','Retry')+'</button></div>';
 if(ok)h+='<div>'+L('শেষ সফল: ','Last OK: ')+new Date(ok).toLocaleString()+'</div>';
 return h+'<div><button class="lk" onclick="rpClr()">'+L('সারি মুছুন','Clear queue')+'</button></div>'}
window.rpShow=function(){var e=document.getElementById('rps');if(e)e.innerHTML=statusHtml()};

window.rpBox=function(){var r=S.rp||{};return '<div class="box"><div class="hd">'+I('cash')+'<b>'+L('রিপোর্ট (ইমেইল ও ড্রাইভ)','Reports (email & Drive)')+'</b></div>'
 +'<div class="sw" style="border:0"><b>'+L('চালু','Enabled')+'</b><button class="tg'+(r.on?' on':'')+'" role="switch" aria-checked="'+!!r.on+'" onclick="rpSet(\'on\','+!r.on+')"></button></div>'
 +'<label>Web App URL</label><input value="'+esc(r.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec" onchange="rpSet(\'url\',this.value.trim())">'
 +'<label>'+L('গোপন কোড (স্ক্রিপ্টের কোডের সাথে হুবহু এক)','Secret code (same as in the script)')+'</label><input value="'+esc(r.token||'')+'" onchange="rpSet(\'token\',this.value.trim())">'
 +'<div class="qadd" style="margin-top:10px"><button onclick="rpTest()">'+L('টেস্ট ইমেইল','Test email')+'</button><button onclick="rpCheck()">'+L('শিট যাচাই','Check sheet')+'</button></div>'
 +'<div class="mute" style="font-size:13px;margin:14px 0 6px">'+L('পুরনো বিক্রি শিটে জমা (ইমেইল যাবে না)','Save old sales to the sheet (no email)')+'</div>'

/* ---------- অ্যাপ আপডেট ---------- */
function curKey(){return APP_V+'|'+PATCH_V}
function srvKey(tx){var a=/var APP_V\s*=\s*'([^']*)'/.exec(tx),b=/var PATCH_V\s*=\s*'([^']*)'/.exec(tx);return(a?a[1]:'?')+'|'+(b?b[1]:'-')}
function setUpd(m){var e=document.getElementById('upds');if(e)e.textContent=m}
function pageUrl(){return location.origin+location.pathname}
window.updApp=function(){
 if(!navigator.onLine){toast(L('আপডেটের জন্য নেট লাগবে','Internet needed to update'));return}
 setUpd(L('চেক করা হচ্ছে…','Checking…'));
 var p=Promise.resolve();
 try{if(navigator.serviceWorker)p=navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})}catch(e){}
 p.then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):0}).catch(function(){})
 .then(function(){return fetch(pageUrl()+'?nocache='+Date.now(),{cache:'reload'})}).then(function(r){return r.text()})
 .then(function(tx){var sk=srvKey(tx),ck=curKey();
  if(sk==ck){setUpd(L('✓ সার্ভারেও এই ভার্সনই আছে (','✓ Server has the same version (')+ck.replace('|',' + ')+L('). নতুন ফাইল GitHub-এ কমিট না হলে বা ডিপ্লয় চললে ১-২ মিনিট পরে আবার চাপুন।','). If you just uploaded, wait 1-2 minutes and try again.'));return}
  fetch(pageUrl(),{cache:'reload'}).catch(function(){}).then(function(){setUpd(L('নতুন ভার্সন পাওয়া গেছে (','New version found (')+sk.replace('|',' + ')+L('), চালু হচ্ছে…','), loading…'));setTimeout(function(){location.reload()},700)});
 }).catch(function(){setUpd(L('✗ চেক করা যায়নি, নেট দেখুন','✗ Could not check, see your internet'))});
};
window.verBox=function(){return '<div class="box"><div class="hd">'+I('set')+'<b>'+L('অ্যাপ ভার্সন','App version')+'</b></div><div class="dl"><span>'+esc(APP_V)+' · '+PATCH_V+'</span><button class="pri" onclick="updApp()">'+L('এখনই আপডেট করুন','Update now')+'</button></div><div id="upds" class="mute" style="font-size:12px">'+L('আপনার বিক্রি ও ডেটা মুছবে না। নতুন ফাইল GitHub-এ দেওয়ার পর এটা চাপুন। সার্ভারে নতুন ভার্সন না থাকলে এখানে সেটা লেখা আসবে।','Your data is kept. Press after uploading new files. If the server has no newer version, this line will say so.')+'</div></div>'};
setTimeout(function(){try{fetch(pageUrl()+'?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(tx){if(srvKey(tx)!=curKey())toast(L('নতুন ভার্সন এসেছে: সেটিংসে "এখনই আপডেট করুন" চাপুন','New version available: press Update now in Settings'))}).catch(function(){})}catch(e){}},6000);

try{if(view=='set')render()}catch(e){}
}catch(err){console.error('Musafir patch p2 error',err)}
})();
</script>

<!-- ===== MUSAFIR REFUND START ===== -->
<script>
(function(){
var RF=null;
function r2(n){return Math.round((+n+1e-9)*100)/100}
function origOf(no){return H.find(function(h){return h.no==no})}
function refundedQty(no){var m={};H.filter(function(h){return h.ref==no}).forEach(function(h){h.items.forEach(function(i){m[i.ix]=(m[i.ix]||0)-i.qty})});return m}
function refundedAmt(no){var a=0;H.filter(function(h){return h.ref==no}).forEach(function(h){a+=-h.total});return r2(a)}
function rfCalc(){
 var s=origOf(RF.no),sub=0,left=0;
 s.items.forEach(function(i,ix){sub+=i.price*RF.q[ix];left+=RF.rem[ix]-RF.q[ix]});
 var ratio=s.sub>0?s.total/s.sub:1,R=r2(sub*ratio),cap=r2(s.total-refundedAmt(RF.no));
 if(sub>0&&left==0)R=cap;
 if(R>cap)R=cap;if(R<0)R=0;
 return {sub:r2(sub),R:R,left:left}}
function rfPays(s,R){
 var pl=(s.pays&&s.pays.length?s.pays:[{m:s.pay,a:s.total}]),tot=0,used=0,out=[];
 pl.forEach(function(p){tot+=p.a});
 pl.forEach(function(p,ix){var a=ix==pl.length-1?r2(R-used):r2(R*p.a/(tot||1));used=r2(used+a);var o={m:p.m,a:-a};if(p.debtor)o.debtor=p.debtor;out.push(o)});
 return out.filter(function(p){return Math.abs(p.a)>0.004})}
function keep(){var w=document.getElementById('rfWhy'),k=document.getElementById('rfStk');if(w)RF.why=w.value;if(k)RF.stk=k.checked}
function rfDraw(){
 var s=origOf(RF.no),c=rfCalc(),pl=rfPays(s,c.R);
 var h='<div><b style="font-size:19px">↩ '+L('রিফান্ড','Refund')+' · '+L('ইনভয়েস','Invoice')+' #'+s.sn+'</b><div class="mute" style="margin:4px 0 6px">'+L('যে পণ্য ফেরত হচ্ছে তার সংখ্যা ঠিক করুন','Set the quantity being returned')+'</div>';
 s.items.forEach(function(i,ix){var dis=RF.rem[ix]?'':'disabled ';
  h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><b>'+esc(nm(i))+'</b><div class="mute">'+$$(i.price)+' · '+RF.rem[ix]+L(' টি ফেরতযোগ্য',' refundable')+'</div></div>'
  +'<button '+dis+'onclick="rfChg('+ix+',-1)" style="width:40px;height:40px;font-size:20px">−</button><b style="min-width:24px;text-align:center;font-size:17px">'+RF.q[ix]+'</b><button '+dis+'onclick="rfChg('+ix+',1)" style="width:40px;height:40px;font-size:20px">+</button></div>'});
 h+='<input id="rfWhy" maxlength="80" placeholder="'+L('কারণ (ঐচ্ছিক), যেমন: ভুল অর্ডার','Reason (optional), e.g. wrong order')+'" value="'+esc(RF.why)+'" style="width:100%;margin-top:10px">'
 +'<label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" id="rfStk" '+(RF.stk?'checked':'')+' onchange="rfKeep()"> '+L('পণ্য স্টকে ফেরত যোগ হবে','Add items back to stock')+'</label>'
 +'<div style="display:flex;justify-content:space-between;align-items:center;font-size:18px;padding:8px 0;border-top:2px solid var(--line)"><b>'+L('রিফান্ডের পরিমাণ','Refund amount')+'</b><b style="color:var(--warn)">'+$$(c.R)+'</b></div>'
 +(c.R>0?'<div class="mute" style="font-size:13px">'+pl.map(function(p){return t(p.m)+(p.debtor?' ('+esc(p.debtor)+')':'')+': '+$$(-p.a)}).join(' · ')+(s.disc||s.tax?'<br>'+L('ছাড়/ট্যাক্স অনুপাতে ধরা হয়েছে','Discount/tax counted proportionally'):'')+'</div>':'')
 +'<button class="bad" '+(c.R>0?'':'disabled ')+'style="width:100%;margin-top:12px;padding:14px;font-weight:800" onclick="rfGo()">↩ '+L('রিফান্ড নিশ্চিত করুন','Confirm refund')+'</button>'
 +'<button style="width:100%;margin-top:8px" onclick="showRc('+s.no+')">'+L('ফিরে যান','Back')+'</button></div>';
 document.getElementById('rb').innerHTML=h;document.getElementById('rc').classList.add('show')}
window.rfKeep=function(){if(RF)keep()};
window.rfChg=function(ix,d){if(!RF)return;keep();var n=RF.q[ix]+d;if(n<0||n>RF.rem[ix])return;RF.q[ix]=n;rfDraw()};
window.refundSale=function(no){
 var s=origOf(no);if(!s||s.refund)return;
 var done=refundedQty(no),rem=s.items.map(function(i,ix){return Math.max(0,i.qty-(done[ix]||0))});
 if(!rem.some(function(x){return x>0})){toast(L('এই বিলের সবকিছু আগেই রিফান্ড হয়েছে','Everything on this sale is already refunded'));return}
 RF={no:no,rem:rem,q:s.items.map(function(){return 0}),why:'',stk:true};rfDraw()};
window.rfGo=function(){
 if(!RF)return;keep();var s=origOf(RF.no);if(!s){RF=null;return}
 var c=rfCalc();if(!(c.R>0)){toast(L('কোনো পণ্য বাছাই করুন','Pick at least one item'));return}
 ask(L('রিফান্ড দেবেন: ','Refund ')+$$(c.R)+'?',function(){doRefund(s,c)},L('হ্যাঁ, রিফান্ড দিন','Yes, refund'))};
function doRefund(s,c){
 if(!RF)return;var now=Date.now(),no=H.reduce(function(a,x){return Math.max(a,x.no)},1000)+1,items=[],why=(RF.why||'').trim(),stk=RF.stk;
 s.items.forEach(function(i,ix){var q=RF.q[ix];if(q>0){items.push({id:i.id,name:i.name,bn:i.bn,price:i.price,qty:-q,ix:ix});
  if(stk){var p=i.id?gp(i.id):P.find(function(x){return x.name==i.name});if(p&&p.stock!=='')p.stock+=q}}});
 var pl=rfPays(s,c.R),tax=c.R>c.sub?r2(c.R-c.sub):0,disc=c.sub>c.R?r2(c.sub-c.R):0;
 var r={no:no,sn:snFor(now),t:now,items:items,sub:-c.sub,disc:disc?-disc:0,tax:tax?-tax:0,total:-c.R,pay:pl.length>1?'Split':(pl[0]?pl[0].m:s.pay),pays:pl,recv:null,chg:0,pc:randCode(),refund:true,ref:s.no,refSn:s.sn,why:why,stk:!!stk};
 if(!CU)r.lc=true;
 H.push(r);
 var dch=false;
 pl.forEach(function(p){if(p.m=='Due'&&p.debtor){var d=DU.find(function(x){return x.name==p.debtor&&(x.entries||[]).some(function(e){return e.sid==s.no})})||DU.find(function(x){return x.name==p.debtor});
  if(d){d.entries=d.entries||[];d.entries.push({t:now,a:p.a,no:r.sn,sid:r.no,items:'↩ '+L('রিফান্ড','Refund')});dch=true;pubDue(d)}}});
 lglog(L('রিফান্ড','Refund')+' #'+r.sn+' ('+L('ইনভয়েস','Invoice')+' #'+s.sn+')'+(why?' · '+why:'')+' · '+items.map(function(i){return nm(i)+'×'+(-i.qty)}).join(', '),c.R);
 save();if(dch)dusave();cSale(r);rqAdd(rqSale(r));pubReceipt(r);RF=null;render();showRc(r.no);toast(L('রিফান্ড হয়েছে','Refund done'))}
/* রসিদ পাতায় রিফান্ড বাটন ও রিফান্ড রসিদের লেবেল */
var _sr=window.showRc;
window.showRc=function(no){
 _sr(no);var s=origOf(no),rb=document.getElementById('rb'),b=document.getElementById('vb');if(!s||!rb)return;
 if(s.refund){
  rb.insertAdjacentHTML('afterbegin','<div style="background:#c4311f22;color:var(--warn);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-weight:800;text-align:center">↩ '+L('রিফান্ড রসিদ · মূল ইনভয়েস #','Refund receipt · original invoice #')+s.refSn+(s.why?'<div style="font-weight:500">'+esc(s.why)+'</div>':'')+'</div>');
  if(b)b.remove();
 }else{
  var had=H.some(function(h){return h.ref==no});
  if(had)rb.insertAdjacentHTML('afterbegin','<div class="noprint" style="background:#c4311f22;color:var(--warn);border-radius:10px;padding:6px 10px;margin-bottom:8px;font-weight:700;text-align:center">↩ '+L('এই বিলে রিফান্ড হয়েছে','This sale has refunds')+' · '+$$(refundedAmt(no))+'</div>');
  if(b)b.insertAdjacentHTML('beforebegin','<button class="noprint" style="width:100%;margin-top:10px" onclick="refundSale('+no+')">↩ '+L('রিফান্ড','Refund')+'</button>');
 }};
var _vs=window.voidSale;
window.voidSale=function(no){var s=origOf(no);if(s&&!s.refund&&H.some(function(h){return h.ref==no})){toast(L('এই বিলে রিফান্ড আছে, তাই বাতিল করা যাবে না','This sale has refunds, so it cannot be voided'));return}return _vs(no)};
})();
</script>
