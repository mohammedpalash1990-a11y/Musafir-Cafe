 var rem=Math.max(0,c.t-paid),chgVal=Math.max(0,paid-c.t);var dueOk=rows.every(function(x){return x.m!='Due'||x.debtor});
 return{rows:rows,paid:paid,rem:rem,chg:chgVal,ok:rows.length>0&&rem<0.005&&chgVal<=cash+0.005&&dueOk}
}

function setM(i,m){pays[i].m=m;if(m=='Due')pickDebtor(i);openCart()}
function addRow(m){

 if(r>0.004){pays.forEach(function(p){p.auto=false});pays.push({m:m,a:r.toFixed(2)})}
 else pays.push({m:m,a:''});
 if(m=='Due'){pickDebtor(pays.length-1)}
 openCart();
 if(r<=0.004&&m!='Due'){setTimeout(function(){var q=document.querySelectorAll('.prow input');if(q.length)q[q.length-1].focus()},60)}
}
function delRow(i){pays.splice(i,1);if(pays.length==1){pays[0].a=calc().t.toFixed(2);pays[0].auto=true}openCart()}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,deleteDoc,collection,onSnapshot,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

if(!/PASTE/.test(window.FIREBASE_CONFIG.apiKey)){
 const app=initializeApp(window.FIREBASE_CONFIG),auth=getAuth(app),db=(function(){try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){return getFirestore(app)}})();let un=[];
 const ref=(c,i)=>doc(db,'users',auth.currentUser.uid,c,i);
 window.FB={
  watch:cb=>onAuthStateChanged(auth,cb),
  login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
  signup:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
  reset:e=>sendPasswordResetEmail(auth,e),
  stop:()=>{un.forEach(f=>f());un=[]},
  out:()=>{window.FB.stop();return signOut(auth)},
  set:(c,i,d)=>setDoc(ref(c,i),JSON.parse(JSON.stringify(d))),
  del:(c,i)=>deleteDoc(ref(c,i)),
  pub:c=>getDoc(doc(db,'receipts',c)).then(s=>s.exists()?s.data():null),
  setPub:(c,d)=>setDoc(doc(db,'receipts',c),JSON.parse(JSON.stringify(d))),
  delPub:c=>deleteDoc(doc(db,'receipts',c)),
  listen:(c,cb,er)=>un.push(onSnapshot(collection(db,'users',auth.currentUser.uid,c),cb,er))
 };
}
if(window.onFB)window.onFB();
</script>
</body></html>
