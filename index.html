<style>
:root{--bg:#e9edf3;--card:#fff;--ink:#1b2733;--mute:#657386;--line:#d3dae5;--ac:#3f9a22;--acink:#fff;--soft:#e3f1dc;--warn:#c4311f;--blue:#3446b8;--head:#14454b;--hink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1d;--card:#142529;--ink:#e6f0f1;--mute:#8fa5a8;--line:#244047;--ac:#5cb82e;--acink:#05200a;--soft:#17331f;--warn:#ff8a7a;--blue:#93a6ff;--head:#0b2a2e;--hink:#fff}}
:root[data-theme="dark"]{--bg:#0d1a1d;--card:#142529;--ink:#e6f0f1;--mute:#8fa5a8;--line:#244047;--ac:#5cb82e;--acink:#05200a;--soft:#17331f;--warn:#ff8a7a;--blue:#93a6ff;--head:#0b2a2e;--hink:#fff}
:root[data-theme="light"]{--bg:#e9edf3;--card:#fff;--ink:#1b2733;--mute:#657386;--line:#d3dae5;--ac:#3f9a22;--acink:#fff;--soft:#e3f1dc;--warn:#c4311f;--blue:#3446b8;--head:#14454b;--hink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;padding-bottom:140px;font-weight:500}
html{--fz:1;--dz:1;zoom:calc(var(--fz) * var(--dz))}
html[data-fsz="sm"]{--fz:.88}
html[data-fsz="lg"]{--fz:1.15}
html[data-fsz="xl"]{--fz:1.3}
@media (min-width:860px) and (hover:hover) and (pointer:fine){html{--dz:.82}
 main{max-width:1800px}
 .p{min-height:112px;padding:10px;border:1px solid var(--line);transition:border-color .12s,box-shadow .12s,transform .12s}
 .p:hover:not(:disabled){border-color:var(--ac);box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translateY(-1px)}
 button:not(:disabled):hover{filter:brightness(1.08)}
 .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important;gap:10px}
 input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
 ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
}
@media (min-width:1400px) and (hover:hover) and (pointer:fine){html{--dz:.9}}
@media (min-width:1800px) and (hover:hover) and (pointer:fine){html{--dz:1}}
@media print{html{zoom:1!important}}
b,button,h1,h2,label{font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--head);color:var(--hink);z-index:5;min-height:64px}
h1{font-size:19px;margin:0;font-weight:800;color:var(--hink)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:8px}
.chip{background:rgba(255,255,255,.15);color:#fff;border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.lg{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:20px;overflow:hidden}
.lg button{border:0;border-radius:0;padding:6px 10px;background:transparent;color:#fff;font-size:13px}
.lg button.on{background:#fff;color:var(--head)}
main{max-width:1400px;margin:0 auto;padding:0 16px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--card);font-weight:600}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:none}
button.bad{color:var(--warn)}
button.bad2{background:var(--warn);color:#fff;border-color:var(--warn)}
.hb{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.cats button{white-space:nowrap;border-radius:20px;padding:7px 15px}
.cats button.on{background:var(--head);border-color:var(--head);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.p{text-align:left;padding:12px;min-height:132px;display:flex;flex-direction:column;gap:6px;position:relative;border-radius:18px;box-shadow:0 1px 2px rgba(23,32,51,.06)}
.p:active{transform:scale(.97)}
.dot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:21px}
.pimg{width:66px;height:66px;border-radius:14px;object-fit:cover;display:block}
.p b{font-size:15px;line-height:1.25}.p span{color:var(--blue);font-weight:800}.p small{color:var(--mute)}.p.low small{color:var(--warn)}
.qty{position:absolute;top:8px;right:8px;background:var(--blue);color:#fff;border-radius:20px;min-width:26px;text-align:center;font-weight:800;padding:2px 8px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .box{margin:0}.stats b{font-size:22px;display:block}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
label.btn{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);font-weight:600;margin:0;color:var(--ink);font-size:14px;display:inline-block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--head);border-top:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;border-radius:0;background:none;padding:9px 4px 10px;color:rgba(255,255,255,.65);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
nav button.on{color:#fff;box-shadow:inset 0 3px 0 #7bd34a}
nav button .i{width:23px;height:23px}
.sw7{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.sw7 button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px;border:2px solid transparent;border-radius:12px;background:none;font-size:11px;min-width:64px}.sw7 button.on{border-color:var(--ac)}.sw7 i{display:block;width:40px;height:40px;border-radius:50%;border:2px solid rgba(128,128,128,.4)}
#bar{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;display:flex;justify-content:space-between;padding:15px 18px;border-radius:16px;font-weight:800;z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .lg,.box .lg{border-color:var(--line)}.sheet .lg button,.box .lg button{color:var(--ink)}.sheet .lg button.on,.box .lg button.on{background:var(--ink);color:var(--bg)}
.q{display:flex;align-items:center;gap:6px}.q button{padding:5px 12px}.q .x{border:0;background:none;color:var(--warn);padding:5px 8px;font-size:18px}
.tot{display:flex;justify-content:space-between;padding:3px 0}.tot.g{font-size:22px;font-weight:800;padding-top:8px}
pre{background:var(--card);border:1px dashed var(--mute);padding:14px;border-radius:12px;white-space:pre-wrap;font:13px/1.55 ui-monospace,monospace}
.mute{color:var(--mute)}.empty{padding:36px 10px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none;font-weight:600}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--blue)}.hd b{color:var(--ink);font-size:16px}
.big{font-size:30px;font-weight:800;margin:14px 0 4px;color:var(--ink)}.big span{display:block;font-size:13px;color:var(--mute);font-weight:600}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.pt{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px}
.pi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.bars{display:flex;gap:6px;overflow-x:auto;align-items:flex-end;margin-top:16px;padding-bottom:4px}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:24px;cursor:pointer}
.bc i{width:18px;background:var(--blue);border-radius:6px 6px 3px 3px;display:block}.bc small{color:var(--mute);font-size:11px}
.wide-only{display:none}
.kbars{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin-top:16px}.kbars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;flex:1;max-width:110px}.kbars i{width:100%;border-radius:10px 10px 4px 4px;display:block}.kbars small{color:var(--mute);font-size:12px;text-align:center}.kbars b{font-size:13px}
.oh{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin-bottom:6px;font-size:13px}.oh b{color:var(--ink);font-size:17px}
.nl{color:var(--blue)}
.tbar{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}.tbar b{color:var(--ac);font-size:24px}
button.pay{width:100%;margin-top:12px;background:var(--ac);color:#fff;font-size:18px;font-weight:800;padding:16px;border-radius:14px;border:0}
.codes{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#000;border-radius:12px;padding:12px}
.bc128{width:100%;max-width:300px;height:56px}.qr{width:132px;height:132px}.cid{font:600 12px ui-monospace,monospace;letter-spacing:1px}
#ib{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:1400px;margin:10px auto 0;padding:0 16px}
#ib .lb{padding:7px 12px;font-size:13px;border-radius:20px}
.clk{text-align:right;line-height:1.2;flex:none}.clk b{display:block;font-size:15px}.clk span{font-size:11px;color:var(--mute)}
.payh{display:flex;align-items:center;gap:8px;margin:16px 0 6px;color:var(--ac)}.payh b{color:var(--ink)}
.prow{display:grid;grid-template-columns:116px 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.qadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.qadd button{padding:8px 12px;background:var(--soft);border-color:transparent;color:var(--ac)}
.sum{background:var(--bg);border-radius:14px;padding:10px 12px;margin-top:10px}
.tot.rem b{color:var(--warn)}.tot.ok b{color:var(--ac)}
button.pay:disabled{opacity:.5}
.thm{padding:7px 9px;border-radius:50%;line-height:0}
.rcpt{background:#fff;color:#000;font:700 15px/1.3 "Hind Siliguri","Plus Jakarta Sans","Noto Sans Bengali",system-ui,sans-serif;width:100%;max-width:370px;margin:0 auto;padding:12px 13px 11px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.rcpt b{font-weight:800}
.rs{display:block;text-align:center;font-size:25px;font-weight:800;letter-spacing:.2px}
.rl{display:flex;justify-content:center;margin:0 0 3px}.rl svg{height:42px;width:auto;display:block}
.rm{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-top:1.5px dashed #000;border-bottom:1.5px dashed #000;padding:3px 0;margin:6px 0}
.rcpt table{width:100%;border-collapse:collapse}.rcpt td{padding:1.5px 0;vertical-align:top;font-weight:700}
.rcpt td.q{text-align:center;white-space:nowrap;font-size:13.5px;padding:0 6px}.rcpt td.a{text-align:right;white-space:nowrap}
.rt{display:flex;justify-content:space-between;padding:1px 0}
.rt.g{font-size:23px;font-weight:800;border-top:1.5px dashed #000;margin-top:4px;padding-top:4px}
.rt.py{font-size:14.5px}
.ft{display:flex;align-items:center;gap:9px;border-top:1.5px dashed #000;margin-top:5px;padding-top:5px}
.ft .qrw{flex:none;line-height:0}.ft svg{width:var(--q,64px);height:var(--q,64px)}
.th{font-size:14.5px;line-height:1.3}.th2{font-size:13px}
.xl{font-size:13px;text-align:center;border-top:1px dashed #000;margin-top:4px;padding-top:3px;line-height:1.3}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0 4px;border-top:1px solid var(--line)}.sw:first-of-type{border-top:0}
.tg{width:48px;height:27px;border-radius:20px;background:var(--line);position:relative;border:0;padding:0;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ac)}.tg.on:after{left:24px}
.rb select,.rb input{margin:4px 0}
@media (max-width:859px){.sheet{max-width:none}}
.stk{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);margin:0 -16px;padding:6px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:2}

 return items.length?items.map(function(x){return '<div style="margin:10px 0"><div class="dl" style="margin:0 0 4px"><span>'+x.n+'</span><b>'+$$(x.v)+'</b></div><div style="height:8px;border-radius:6px;background:var(--line)"><div style="height:8px;border-radius:6px;width:'+Math.max(2,Math.round(x.v/mx*100))+'%;background:'+(x.c||col)+'"></div></div></div>'}).join(''):'<div class="empty">'+L('কিছু নেই','Nothing yet')+'</div>'}
function kChart(){var pm={};KH.p.forEach(function(p){pm[p.id]=p});
 var tx=KH.tx.filter(function(x){return (x.d||'').slice(0,7)==kdm&&pm[x.pid]}),ex=KH.ex.filter(function(x){return (x.d||'').slice(0,7)==kdm});
 var sT=kTot(tx.filter(function(x){return pm[x.pid].type=='staff'})),oT=kTot(tx.filter(function(x){return pm[x.pid].type=='owner'})),eT=kTot(ex);
 var mx=Math.max(sT,oT,eT,1),bars=[[L('কর্মী','Staff'),sT,KCOL.staff],[L('মালিক','Owner'),oT,KCOL.owner],[L('খরচ','Expenses'),eT,KCOL.exp]];
 var h='<div class="box"><div class="hd">'+I('dash')+'<b>'+kdm+'</b></div><div class="big">'+$$(sT+oT+eT)+'<span>'+L('এ মাসে মোট বের হয়েছে','Total out this month')+'</span></div><div class="kbars">'+bars.map(function(b){return '<div><b>'+S.cur+' '+Math.round(b[1])+'</b><i style="height:'+Math.max(4,Math.round(b[1]/mx*110))+'px;background:'+b[2]+'"></i><small>'+b[0]+'</small></div>'}).join('')+'</div></div>';
 var eb={};ex.forEach(function(x){eb[x.kind]=(eb[x.kind]||0)+(+x.a||0)});
 h+='<div class="box"><b>'+L('খরচের ধরন অনুযায়ী','Expenses by type')+'</b>'+kBarRows(Object.keys(eb).sort(function(a,b){return eb[b]-eb[a]}).map(function(k){return{n:kLbl(KE_K,k),v:eb[k]}}),KCOL.exp)+'</div>';
 var tb={};tx.forEach(function(x){tb[x.kind]=(tb[x.kind]||0)+(+x.a||0)});
 h+='<div class="box"><b>'+L('লেনদেনের ধরন অনুযায়ী (কর্মী ও মালিক)','Entries by type (staff & owner)')+'</b>'+kBarRows(Object.keys(tb).sort(function(a,b){return tb[b]-tb[a]}).map(function(k){return{n:kLbl(KT_K,k),v:tb[k]}}),KCOL.staff)+'</div>';
 var pb={};tx.forEach(function(x){pb[x.pid]=(pb[x.pid]||0)+(+x.a||0)});
 h+='<div class="box"><b>'+L('ব্যক্তি অনুযায়ী','By person')+'</b>'+kBarRows(Object.keys(pb).sort(function(a,b){return pb[b]-pb[a]}).map(function(k){return{n:esc(pm[k].name),v:pb[k],c:KCOL[pm[k].type]}}),KCOL.staff)+'</div>';
 return h}

var otpS=null,otpPass=false,otpDone={};
function otpOn(){return S.otp!==false}
function otpSet(v){S.otp=v;save();render()}
function otpBox(){var on=otpOn();return '<div class="box"><div class="hd">'+I('phone')+'<b>'+L('বাকির কনফার্মেশন কোড','Due confirmation code')+'</b></div><div class="sw" style="border:0"><b>'+L('চালু','Enabled')+'</b><button class="tg'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" onclick="otpSet('+!on+')"></button></div><div class="mute" style="font-size:12px">'+L('বাকিতে বিক্রির সময় কাস্টমারকে ৫ ডিজিটের কোড পাঠানো হয়। কাস্টমার কোড বললে তবেই বাকি সেভ হয়। বন্ধ রাখলে আগের মতো সরাসরি সেভ হবে।','On a due sale, a 5-digit code is sent to the customer. The due is saved only after the customer tells you the code. Turn off to save directly as before.')+'</div></div>'}
function otpGen(){var a=new Uint32Array(1);try{window.crypto.getRandomValues(a)}catch(e){a[0]=Math.floor(Math.random()*4294967295)}return String(10000+a[0]%90000)}
function otpQueue(ps){var m={},q=[];ps.rows.forEach(function(x){var a=+x.a||0;if(x.m=='Due'&&x.debtor&&a>0.004){if(!m[x.debtor.id]){m[x.debtor.id]={id:x.debtor.id,name:x.debtor.name,a:0};q.push(m[x.debtor.id])}m[x.debtor.id].a+=a}});return q}
function otpCur(){var c=otpS.q[otpS.i];return{c:c,d:DU.find(function(x){return x.id==c.id})||{}}}
/* লিংকের পাতায় কোড (কোনো সময়সীমা নেই) */
function pubOtp(){var o=otpS,c=otpCur().c;if(!c.pc||!CU||!window.FB||!FB.setPub)return;
 w(FB.setPub(c.pc,{type:'otp',uid:CU,shop:S.shop,cur:S.cur,lang:S.lang,name:c.name,a:+c.a.toFixed(2),code:o.code,t:Date.now()}))}
function otpFresh(){otpS.code=otpGen();otpS.exp=Date.now()+600000;otpS.tries=0;pubOtp()}
function otpStart(q){otpS={q:q,i:0,code:'',exp:0,tries:0,done:{}};otpFresh();otpView()}
function otpMsg(){var c=otpCur().c,bn=S.lang!='en';
 return S.shop+'\n'+(bn?'আপনি '+$$(c.a)+' বাকি নিচ্ছেন। কনফার্ম করতে এই কোডটি আমাদের বলুন (১০ মিনিট চলবে):':'You are taking '+$$(c.a)+' on credit. To confirm, tell us this code (valid 10 minutes):')+'\n*'+otpS.code+'*'}
function otpLink(){var c=otpCur().c;if(!CU||!window.FB||!FB.setPub){toast(L('লিংকের জন্য লগইন ও ইন্টারনেট লাগবে','Link needs login and internet'));return ''}
 if(!c.pc){c.pc=randCode()}pubOtp();return pubLink(c.pc)}
function otpLinkMsg(lk){var c=otpCur().c,bn=S.lang!='en';
 return S.shop+'\n'+(bn?'আপনি '+$$(c.a)+' বাকি নিচ্ছেন। কনফার্ম করতে নিচের লিংক খুলে কোডটি আমাদের বলুন:':'You are taking '+$$(c.a)+' on credit. To confirm, open the link and tell us the code:')+'\n'+lk}
function otpView(){var o=otpS,x=otpCur(),c=x.c,d=x.d;
 var h='<div class="hd">'+I('phone')+'<b>'+L('বাকির কনফার্মেশন কোড','Due confirmation code')+'</b>'+(o.q.length>1?'<span class="mute" style="margin-left:auto">'+(o.i+1)+'/'+o.q.length+'</span>':'')+'</div>';
 h+='<div class="box"><div style="display:flex;align-items:center;gap:10px">'+kAv({photo:d.photo,name:c.name},44)+'<div><b>'+esc(c.name)+'</b><div class="mute" style="font-size:12px">'+L('বাকি নিচ্ছে','Taking on credit')+'</div></div></div><div class="big">'+$$(c.a)+'</div>';
 h+='<label>'+t('debtorPhone')+'</label><input id="otph" inputmode="tel" value="'+esc(d.phone||'')+'" placeholder="+8801XXXXXXXXX">';
 h+='<div class="mute" style="font-size:12px;margin-top:14px">'+L('১) লিংক পাঠান — কোড আপনার চোখে পড়বে না, শুধু কাস্টমার দেখবে','1) Send a link — you will not see the code, only the customer does')+'</div>';
 h+='<button class="wa" style="width:100%;margin-top:6px" onclick="otpLinkSend()">'+L('WhatsApp-এ লিংক পাঠান','Send link on WhatsApp')+'</button>';
 h+='<div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1" onclick="otpLinkShare()">'+L('লিংক শেয়ার','Share link')+'</button><button style="flex:1" onclick="otpLinkCopy()">'+I('copy')+' '+L('লিংক কপি','Copy link')+'</button></div>';
 h+='<div class="mute" style="font-size:12px;margin-top:14px">'+L('২) কোডসহ মেসেজ পাঠান (১০ মিনিট চলবে)','2) Send a message with the code (valid 10 minutes)')+'</div>';
 h+='<button style="width:100%;margin-top:6px" onclick="otpSend()">'+L('WhatsApp-এ কোড পাঠান','Send code on WhatsApp')+'</button>';
 h+='<div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1" onclick="otpShare()">'+L('শেয়ার (IMO ইত্যাদি)','Share (IMO etc.)')+'</button><button style="flex:1" onclick="otpCopy()">'+I('copy')+' '+L('মেসেজ কপি','Copy message')+'</button></div></div>';
 h+='<div class="box"><label style="margin-top:0">'+L('কাস্টমার যে কোড বলল, এখানে লিখুন','Enter the code the customer tells you')+'</label><input id="otpin" inputmode="numeric" maxlength="5" autocomplete="one-time-code" placeholder="_ _ _ _ _" style="text-align:center;font-size:24px;letter-spacing:8px" onkeydown="if(event.key==\'Enter\')otpOk()">'
  +'<button class="pri" style="width:100%;margin-top:10px" onclick="otpOk()">'+t('done')+'</button><button style="width:100%;margin-top:8px" onclick="otpNew()">'+L('নতুন কোড বানান','New code')+'</button></div>';
 h+='<button style="width:100%;margin-top:6px" onclick="otpCancel()">'+t('back')+'</button>';
 $('#dsb').innerHTML=h;$('#ds').classList.add('show')}
function otpPhone(){var x=otpCur(),d=x.d,e=$('#otph'),p=(e?e.value:d.phone||'').trim();
 if(p.replace(/\D/g,'').length<8){toast(L('সঠিক ফোন নম্বর দিন','Enter a valid phone number'));return null}
 if(d.id!==undefined&&d.phone!==p){d.phone=p;dusave()}return p}
function otpIntl(p){var n=String(p).replace(/\D/g,'');return n.length>=10&&n.charAt(0)!='5'||String(p).trim().charAt(0)=='+'||n.indexOf('00')==0||n.indexOf('880')==0}
function otpOpen(p,m){if(otpIntl(p))waOpen(p,m);else{toast(L('দেশের কোডসহ নম্বর দিন (যেমন +966…)। এখন WhatsApp-এ কন্টাক্ট বেছে নিন','Add the country code (e.g. +966…). Pick the contact in WhatsApp now'));waOpen('',m)}}
function otpAlive(){var c=otpCur().c;if(!c.pc&&Date.now()>otpS.exp){otpFresh();toast(L('আগের কোডের মেয়াদ শেষ, নতুন কোড বানানো হয়েছে','Old code expired, new code made'))}}
function otpSend(){var p=otpPhone();if(!p)return;otpAlive();otpOpen(p,otpMsg())}
function otpShare(){var p=otpPhone();if(!p)return;otpAlive();var m=otpMsg();try{if(navigator.share){navigator.share({text:m});return}}catch(e){}otpCopy()}
function otpCopy(){otpAlive();try{navigator.clipboard.writeText(otpMsg());toast(L('মেসেজ কপি হয়েছে','Message copied'))}catch(e){toast(t('csvno'))}}
function otpLinkSend(){var p=otpPhone();if(!p)return;var lk=otpLink();if(!lk)return;otpOpen(p,otpLinkMsg(lk))}
function otpLinkShare(){var p=otpPhone();if(!p)return;var lk=otpLink();if(!lk)return;var m=otpLinkMsg(lk);try{if(navigator.share){navigator.share({text:m});return}}catch(e){}try{navigator.clipboard.writeText(m);toast(L('মেসেজ কপি হয়েছে','Message copied'))}catch(e){toast(t('csvno'))}}
function otpLinkCopy(){var lk=otpLink();if(!lk)return;try{navigator.clipboard.writeText(lk);toast(L('লিংক কপি হয়েছে','Link copied'))}catch(e){toast(t('csvno'))}}
function otpNew(){otpFresh();toast(otpCur().c.pc?L('নতুন কোড বানানো হয়েছে, আগের লিংকেই নতুন কোড দেখাবে','New code made, the same link now shows it'):L('নতুন কোড বানানো হয়েছে, আগেরটা আর চলবে না','New code made, the old one is void'));otpView()}
function otpCancel(){otpS=null;closeDs()}
function otpOk(){var o=otpS,c=otpCur().c,v=($('#otpin').value||'').trim();
 if(!c.pc&&Date.now()>o.exp){otpFresh();toast(L('কোডের মেয়াদ শেষ, নতুন কোড পাঠান','Code expired, send a new one'));otpView();return}
 if(v!==o.code){o.tries++;if(o.tries>=5){otpFresh();toast(c.pc?L('পাঁচবার ভুল, লিংকে নতুন কোড বসেছে','Five wrong tries, the link now shows a new code'):L('পাঁচবার ভুল, নতুন কোড বানানো হয়েছে','Five wrong tries, new code made'));otpView()}else{toast(L('কোড মেলেনি, আবার দিন','Code does not match'));$('#otpin').value=''}return}
 o.done[c.id]=v;o.i++;
 if(o.i<o.q.length){otpFresh();otpView();return}
 otpDone=o.done;otpPass=true;otpS=null;closeDs();window.charge()}

function showLogin(msg,em){
 $('#lgn').classList.add('show');
 $('#lb').innerHTML='<div style="display:flex;justify-content:center;margin-bottom:8px">'+LOGO.replace('width="40" height="40"','width="64" height="64"')+'</div><h2 style="margin:0 0 4px;text-align:center">'+esc(S.shop)+'</h2><p class="mute" style="text-align:center">'+L('লগইন করুন, সব ডিভাইসে একই হিসাব পাবেন','Log in to see the same data on every device')+'</p>'+(msg?'<p style="color:var(--warn);font-weight:600;text-align:center">'+esc(msg)+'</p>':'')+'<label>Email</label><input id="le" type="email" autocomplete="email" value="'+esc(em||'')+'"><label>'+L('পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)','Password (min 6 characters)')+'</label><input id="lp" type="password" autocomplete="current-password"><div style="display:flex;gap:10px;margin-top:14px"><button class="pri" style="flex:1" onclick="doAuth(0)">'+L('লগইন','Log in')+'</button><button style="flex:1" onclick="doAuth(1)">'+L('নতুন একাউন্ট','Sign up')+'</button></div><button style="width:100%;margin-top:10px;border:0;background:none;color:var(--ac)" onclick="doReset()">'+L('পাসওয়ার্ড ভুলে গেছেন?','Forgot password?')+'</button><div class="lg" style="width:max-content;margin:8px auto 0"><button class="'+(S.lang=='bn'?'on':'')+'" onclick="S.lang=\'bn\';showLogin()">বাংলা</button><button class="'+(S.lang=='en'?'on':'')+'" onclick="S.lang=\'en\';showLogin()">English</button><button class="'+(S.lang=='bi'?'on':'')+'" onclick="S.lang=\'bi\';showLogin()">বাংলা+EN</button></div><p class="mute" style="font-size:11px;text-align:center;margin:10px 0 0">Musafir Cafe POS · '+esc((window.FIREBASE_CONFIG||{}).projectId||'')+'</p>';
}

function errMsg(x){var c=(x&&x.code)||'';
 if(/invalid-credential|wrong-password|user-not-found/.test(c))return L('ইমেইল বা পাসওয়ার্ড ভুল','Wrong email or password');
 if(/email-already/.test(c))return L('এই ইমেইলে একাউন্ট আছে, লগইন করুন','Account exists, please log in');
 if(/weak-password/.test(c))return L('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন','Password needs 6+ characters');
 if(/invalid-email/.test(c))return L('ইমেইলটি সঠিক নয়','Invalid email');
 if(/network/.test(c))return L('ইন্টারনেট নেই','No internet');
 return c||String((x&&x.message)||x||'Error')
}

function doAuth(n){var e=$('#le').value.trim(),p=$('#lp').value;
 if(!e||!p){showLogin(L('ইমেইল ও পাসওয়ার্ড দিন','Enter email and password'),e);return}
 document.querySelectorAll('#lb button').forEach(function(x){x.disabled=true});
 $('#lb').insertAdjacentHTML('afterbegin','<p style="font-weight:700;text-align:center">'+L('অপেক্ষা করুন…','Please wait…')+'</p>');
 var to=setTimeout(function(){showLogin(L('সাড়া নেই। ইন্টারনেট বা অ্যাড-ব্লকার দেখুন','No response. Check internet or ad-blocker'),e)},15000);
 try{FB[n?'signup':'login'](e,p).then(function(){clearTimeout(to)}).catch(function(x){clearTimeout(to);showLogin(errMsg(x),e)})}catch(x){clearTimeout(to);showLogin(String(x),e)}
}

function doReset(){var e=$('#le').value.trim();if(!e){showLogin(L('আগে ইমেইল লিখুন','Enter your email first'));return}FB.reset(e).then(function(){showLogin(L('রিসেট লিংক ইমেইলে পাঠানো হয়েছে','Reset link sent to your email'),e)}).catch(function(x){showLogin(errMsg(x),e)})}

function onPos(snap){var d={};snap.docs.forEach(function(x){d[x.id]=x.data()});
 if(!d.settings&&!d.products){if(snap.metadata.fromCache)return;ready=true;sy('on');push();Object.keys(IMG).forEach(function(k){FB.set('pos','img_'+k,{d:IMG[k]})});welcome();return}
 if(d.settings)S=Object.assign({shop:'Musafir Cafe',cur:'৳',tax:0,lang:'bn'},d.settings);if(d.products)P=d.products.list||[];if(d.due)DU=d.due.list||[];khIn(d);
 var n={};Object.keys(d).forEach(function(k){if(k.indexOf('img_')==0&&d[k])n[k.slice(4)]=d[k].d});IMG=n;
 ready=true;lsave();sy('on');render();welcome()

<script>

function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej({name:'AbortError'})},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
function post(ev){
 var url=S.rp.url,body=JSON.stringify({token:(S.rp||{}).token||'',ev:ev}),hd={'Content-Type':'text/plain;charset=utf-8'};
 var need=ev.k=='batch'||ev.k=='stat'||ev.k=='month';
 return withTimeout(fetch(url,{method:'POST',headers:hd,body:body}).then(function(r){return r.text()}),45000).then(function(tx){
  tx=(tx||'').trim();
  if(tx=='bad token')return{fatal:true,msg:L('✗ গোপন কোড মেলেনি। অ্যাপ আর স্ক্রিপ্টের কোড হুবহু এক করুন','✗ Secret code does not match')};
  if(tx.charAt(0)=='<')return{fatal:true,msg:L('✗ Deploy-এ Who has access = Anyone দিয়ে New version করে Deploy করুন','✗ Deploy as "Anyone" and publish a new version')};
  if(need&&tx=='ok')return{fatal:true,msg:L('✗ স্ক্রিপ্ট পুরনো। নতুন daily-report কোড বসিয়ে New version Deploy করুন','✗ Script is old. Paste the new script and deploy a new version')};
  if(tx=='ok'||tx.indexOf('ok:')==0)return{ok:true,txt:tx};
  return{err:true,msg:tx.slice(0,80)||'empty'};
 }).catch(function(e){
  if(e&&e.name=='AbortError')return{net:true,msg:L('সাড়া আসেনি (৪৫ সেকেন্ড)','No response (45s)')};
  return withTimeout(fetch(url,{method:'POST',mode:'no-cors',headers:hd,body:body}),45000).then(function(){return{ok:true,unv:true,txt:''}}).catch(function(e2){return{net:true,msg:L('নেট বা সংযোগ সমস্যা','Network problem')}});
 });

var busy=false,fails=0;
function fin(){busy=false;rpShow()}
function bump(id,n){var q=rqGet();if(q[0]&&q[0].id==id){q[0].from=(q[0].from||0)+n;rqSet(q)}}
function dropHead(h){var q=rqGet();if(q.length&&JSON.stringify(q[0])==JSON.stringify(h)){q.shift();rqSet(q)}}
function toDead(ev){var d=lget(LS_DEAD,[]);d.push(ev);lset(LS_DEAD,d)}
window.rqFlush=function(){if(!rpOn()||busy||!navigator.onLine)return;if(!rqGet().length){rpShow();return}busy=true;step()};
function step(){
 var q=rqGet();
 if(!q.length){if(ST.verify){ST.verify=false;rpCheck(true)}fin();return}
 var h=q[0],ev,done,n=1;
 if(h.k=='hist'){
  var list=selSales(h),from=h.from||0;
  if(from>=list.length){q.shift();rqSet(q);ST.msg=good('✓ '+L('হিস্ট্রি পাঠানো শেষ','History upload finished'))+' · '+stamp();step();return}
  if(h.single){ev=rqSale(list[from]);done=function(){bump(h.id,1)}}
  else{var part=list.slice(from,from+BATCH);n=part.length;ev={k:'batch',list:part.map(function(s){return rqSale(s)}),shop:S.shop,cur:S.cur};done=function(){bump(h.id,part.length)}}
 }else{ev=h;done=function(){dropHead(h)}}
 post(ev).then(function(r){
  if(r.ok){fails=0;done();lset(LS_OK,Date.now());
   ST.msg=good('✓ '+(h.k=='hist'?n+L(' টি বিক্রি শিটে গেছে',' sales sent'):L('পাঠানো হয়েছে','Sent')))+(r.unv?' <span class="mute">'+L('(নিশ্চিত নয়, "শিট যাচাই" চাপুন)','(unconfirmed, press Check sheet)')+'</span>':'')+' · '+stamp();
   rpShow();step();return}
  if(r.fatal){ST.msg=bad(r.msg);fin();return}
  if(r.net){ST.msg=bad(L('✗ ','✗ ')+r.msg)+' <span class="mute">'+L('১ মিনিট পরে নিজে আবার চেষ্টা হবে','will retry in 1 minute')+'</span>';fin();return}
  fails++;
  if(h.k=='hist'&&!h.single){var q2=rqGet();if(q2[0]&&q2[0].id==h.id){q2[0].single=true;rqSet(q2)}fails=0;ST.msg=bad('✗ '+esc(r.msg))+' · '+L('একটা একটা করে পাঠানো হচ্ছে','sending one by one');rpShow();setTimeout(step,800);return}
  if(fails>=3){toDead(ev);if(h.k=='hist')bump(h.id,1);else dropHead(h);fails=0;ST.msg=bad('✗ '+esc(r.msg))+' · '+L('একটা ইভেন্ট ব্যর্থ তালিকায় গেছে','one event moved to failed list');rpShow();step();return}
  ST.msg=bad('✗ '+esc(r.msg));rpShow();setTimeout(step,1500);
 });
}

 +'<div class="qadd" style="margin-top:10px"><button onclick="rpTest()">'+L('টেস্ট ইমেইল','Test email')+'</button><button onclick="rpCheck()">'+L('শিট যাচাই','Check sheet')+'</button></div>'
 +'<div class="mute" style="font-size:13px;margin:14px 0 6px">'+L('পুরনো বিক্রি শিটে জমা (ইমেইল যাবে না)','Save old sales to the sheet (no email)')+'</div>'
 +'<div class="qadd"><button onclick="rpHist()">'+L('সব পুরনো বিক্রি পাঠান','Upload all history')+'</button></div>'
 +'<div id="rps" class="mute" style="font-size:13px;margin-top:12px">'+statusHtml()+'</div></div>'};

/* ---------- অ্যাপ আপডেট ---------- */
function curKey(){return APP_V+'|'+PATCH_V}
function srvKey(tx){var a=/var APP_V\s*=\s*'([^']*)'/.exec(tx),b=/var PATCH_V\s*=\s*'([^']*)'/.exec(tx);return(a?a[1]:'?')+'|'+(b?b[1]:'-')}
function setUpd(m){var e=document.getElementById('upds');if(e)e.textContent=m}
function pageUrl(){return location.origin+location.pathname}
window.updApp=function(){
 if(!navigator.onLine){toast(L('আপডেটের জন্য নেট লাগবে','Internet needed to update'));return}
 setUpd(L('চেক করা হচ্ছে…','Checking…'));
 var p=Promise.resolve();
 try{if(navigator.serviceWorker)p=navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))})}catch(e){}
 p.then(function(){return window.caches?caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}):0}).catch(function(){})
 .then(function(){return fetch(pageUrl()+'?nocache='+Date.now(),{cache:'reload'})}).then(function(r){return r.text()})
 .then(function(tx){var sk=srvKey(tx),ck=curKey();
  if(sk==ck){setUpd(L('✓ সার্ভারেও এই ভার্সনই আছে (','✓ Server has the same version (')+ck.replace('|',' + ')+L('). নতুন ফাইল GitHub-এ কমিট না হলে বা ডিপ্লয় চললে ১-২ মিনিট পরে আবার চাপুন।','). If you just uploaded, wait 1-2 minutes and try again.'));return}
  fetch(pageUrl(),{cache:'reload'}).catch(function(){}).then(function(){setUpd(L('নতুন ভার্সন পাওয়া গেছে (','New version found (')+sk.replace('|',' + ')+L('), চালু হচ্ছে…','), loading…'));setTimeout(function(){location.reload()},700)});
 }).catch(function(){setUpd(L('✗ চেক করা যায়নি, নেট দেখুন','✗ Could not check, see your internet'))});
};
window.verBox=function(){return '<div class="box"><div class="hd">'+I('set')+'<b>'+L('অ্যাপ ভার্সন','App version')+'</b></div><div class="dl"><span>'+esc(APP_V)+' · '+PATCH_V+'</span><button class="pri" onclick="updApp()">'+L('এখনই আপডেট করুন','Update now')+'</button></div><div id="upds" class="mute" style="font-size:12px">'+L('আপনার বিক্রি ও ডেটা মুছবে না। নতুন ফাইল GitHub-এ দেওয়ার পর এটা চাপুন। সার্ভারে নতুন ভার্সন না থাকলে এখানে সেটা লেখা আসবে।','Your data is kept. Press after uploading new files. If the server has no newer version, this line will say so.')+'</div></div>'};
setTimeout(function(){try{fetch(pageUrl()+'?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(tx){if(srvKey(tx)!=curKey())toast(L('নতুন ভার্সন এসেছে: সেটিংসে "এখনই আপডেট করুন" চাপুন','New version available: press Update now in Settings'))}).catch(function(){})}catch(e){}},6000);

try{if(view=='set')render()}catch(e){}
}catch(err){console.error('Musafir patch p2 error',err)}
})();
</script>
<!-- ===== MUSAFIR PATCH p2 END ===== -->

<script type="module">
import {getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,updateDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
try{
const app=getApp(),auth=getAuth(app),db=getFirestore(app);let uid=null,un=null,ords=[],seen=null,open=false,lastSig='',pi={};
try{pi=JSON.parse(localStorage.getItem('qr_img')||'{}')}catch(e){}
const st=document.createElement('style');st.textContent='#qb{position:fixed;right:12px;bottom:88px;z-index:21;border:0;border-radius:99px;padding:11px 16px;font:inherit;font-weight:700;background:var(--ac);color:var(--acink);box-shadow:0 3px 12px #0004;display:none}#qb i{font-style:normal;background:#e0301e;color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}#qb.nw{animation:qbp 1s infinite}@keyframes qbp{50%{transform:scale(1.12)}}#qp{position:fixed;inset:0;background:#0007;z-index:35;display:none;align-items:flex-end;justify-content:center}#qp>div{background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}.qo{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.qo button{margin:3px 3px 0 0}';document.head.appendChild(st);
const b=document.createElement('button');b.id='qb';document.body.appendChild(b);const p=document.createElement('div');p.id='qp';document.body.appendChild(p);
b.onclick=()=>{open=true;draw()};p.onclick=e=>{if(e.target==p){open=false;draw()}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pend=()=>ords.filter(o=>o.status=='new'||o.status=='accepted');
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function draw(){const a=pend(),nw=a.filter(o=>o.status=='new').length;b.style.display=uid?'block':'none';b.className=nw?'nw':'';b.innerHTML='📲 QR অর্ডার'+(a.length?'<i>'+a.length+'</i>':'');
 p.style.display=open?'flex':'none';if(!open)return;
 p.innerHTML='<div><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">📲 QR অর্ডার</b><span><button onclick="qrTables()">টেবিল QR ছাপুন</button><button onclick="qrPub(1)">মেনু আপডেট</button></span></div><div id="qm" class="mute" style="font-size:12px"></div>'+
 (a.length?a.map(o=>'<div class="qo"><b>টেবিল '+E(o.table)+'</b>'+(o.name?' · '+E(o.name):'')+' <span class="mute">'+new Date(o.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span>'+(o.status=='accepted'?' <b style="color:var(--ac)">✔ গ্রহণ করা</b>':' <b style="color:#e0301e">নতুন</b>')+
 '<div>'+o.items.map(i=>E(i.n)+' × '+i.q).join('<br>')+'</div>'+(o.note?'<div class="mute">নোট: '+E(o.note)+'</div>':'')+'<b>মোট (কাস্টমারের হিসাবে) '+o.total+'</b><br>'+
 (o.status=='new'?'<button onclick="qrSt(\''+o.id+'\',\'accepted\')">গ্রহণ করুন</button>':'')+'<button onclick="qrBill(\''+o.id+'\')">বিলে নিন</button><button style="background:#b3321f;color:#fff" onclick="qrSt(\''+o.id+'\',\'cancelled\')">বাতিল</button></div>').join(''):'<p class="mute">এখন কোনো অপেক্ষমাণ অর্ডার নেই</p>')+'<button style="width:100%;margin-top:8px" onclick="qrClose()">বন্ধ করুন</button></div>'}
window.qrClose=()=>{open=false;draw()};
window.qrSt=(id,s)=>updateDoc(doc(db,'orders',id),{status:s}).catch(()=>toast('হয়নি, নেট দেখুন'));
window.qrBill=id=>{const o=ords.find(x=>x.id==id);if(!o)return;
 const go=()=>{let miss=0;o.items.forEach(i=>{const q=gp(i.id);if(!q){miss++;return}let n=(cart[i.id]||0)+i.q;if(q.stock!==''&&n>q.stock)n=q.stock;if(n>0)cart[i.id]=n});
  updateDoc(doc(db,'orders',id),{status:'billed'}).catch(()=>{});open=false;draw();go2('sell');openCart();if(miss)toast(miss+'টি পণ্য POS-এ নেই, বাদ গেছে')};
 Object.keys(cart).length?ask('এখন একটা অর্ডার চলছে। এই QR অর্ডার (টেবিল '+o.table+') তাতে যোগ হবে। চালাবেন?',go,'হ্যাঁ, যোগ করুন'):go()};
const go2=v=>window.go(v);
window.qrTables=()=>{const n=+prompt('কয়টি টেবিলের QR চান?','10');if(!n)return;const base=location.href.split('#')[0].split('?')[0].replace(/index\.html$/,'')+'order.html?s='+uid;
 const w=window.open('','_blank');if(!w)return;let h='<title>QR</title><style>body{font-family:sans-serif;display:flex;flex-wrap:wrap;gap:14px}div{width:220px;text-align:center;border:1px dashed #999;padding:8px;page-break-inside:avoid}img{width:200px}</style>';
 for(let i=1;i<=n;i++)h+='<div><b style="font-size:18px">'+E(S.shop)+'</b><br><img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(base+'&t='+i)+'"><br><b>টেবিল '+i+'</b><br>স্ক্যান করে অর্ডার দিন</div>';
 w.document.write(h);w.document.close();setTimeout(()=>w.print(),1200)};
window.qrPub=async f=>{if(!uid||!CU)return;const it=P.map(x=>({id:x.id,n:x.bn||x.name,p:x.price,c:x.cat||'',s:x.stock===''?'':x.stock})),sig=JSON.stringify([it,S.shop,S.cur]);
 if(!f&&sig==lastSig)return;const m=document.getElementById('qm');if(f&&m)m.textContent='মেনু আপডেট হচ্ছে…';
 try{await setDoc(doc(db,'shops',uid),{name:S.shop||'',cur:S.cur||'৳',color:getComputedStyle(document.documentElement).getPropertyValue('--head').trim()||'#14454b',items:it,updated:Date.now()});lastSig=sig;
  for(const k in IMG){const key=k+':'+IMG[k].length;if(pi[k]!==key){await setDoc(doc(db,'shops',uid,'img',String(k)),{d:IMG[k]});pi[k]=key;try{localStorage.setItem('qr_img',JSON.stringify(pi))}catch(e){}}}
  if(f)toast('মেনু আপডেট হয়েছে ('+it.length+'টি পণ্য)')}catch(e){if(f)toast('মেনু আপডেট হয়নি: নেট/Rules দেখুন')}finally{const m2=document.getElementById('qm');if(m2)m2.textContent=''}};
onAuthStateChanged(auth,u=>{if(un){un();un=null}uid=u?u.uid:null;ords=[];seen=null;draw();if(!u)return;
 un=onSnapshot(query(collection(db,'orders'),where('uid','==',u.uid)),sn=>{ords=sn.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.t-x.t);const ids=new Set(pend().filter(o=>o.status=='new').map(o=>o.id));
  if(seen){let n=0;ids.forEach(i=>{if(!seen.has(i))n++});if(n){beep();toast('📲 নতুন QR অর্ডার এসেছে ('+n+'টি)')}}seen=ids;draw()},()=>{});
 setTimeout(()=>qrPub(0),3000)});
setInterval(()=>{if(uid)qrPub(0)},20000);
}catch(err){console.error('QR orders patch error',err)}
</script>
