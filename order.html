function ratingHTML(){const done=ls('rt_'+oid);
 if(done)return `<div class="cd rt" style="animation:none"><div class="stars">${[1,2,3,4,5].map(k=>`<button class="${k<=+done?'on':''}" disabled>★</button>`).join('')}</div><b>${t('rthx')}</b></div>`;
 return `<div class="cd rt" style="animation:none"><b>${t('rate')}</b><div class="stars">${[1,2,3,4,5].map(k=>`<button class="${k<=R.s?'on':''}" data-star="${k}" aria-label="${k}">★</button>`).join('')}</div><div class="mu">${R.s?t('rl')[R.s]:t('rpick')}</div>
 <input id="rc" maxlength="300" placeholder="${t('rcm')}" value="${esc(R.c)}" style="margin-top:10px"><button class="big" id="rs" ${R.s?'':'disabled style="opacity:.5"'} onclick="window.__rate()">${t('rsend')}</button></div>`}
window.__rate=async()=>{if(!R.s||!lastO)return;const b=$('#rs');if(b)b.disabled=true;
 try{await ratePut(oid,{uid,oid,table:lastO.table||'-',name:lastO.name||'',stars:R.s,comment:R.c.trim().slice(0,300),t:Date.now()});ls('rt_'+oid,R.s);paint()}catch(e){alert(t('rfail'));if(b)b.disabled=false}};
function homeExtra(o,home,vs,can){if(!home||can||vs>=2)return '';let x='';
 if(vs==0&&o.status!=='new'&&o.eta){const n=Math.ceil((o.eta-Date.now())/6e4);x+=`<div class="cd" style="animation:none;text-align:center"><b>⏱ ${n>0?t('eta')(n):t('etaSoon')}</b></div>`}
 const ph=String(Q.ph||'').replace(/[^\d+]/g,''),wa=String(Q.wa||'').replace(/\D/g,''),mt=encodeURIComponent(t('etaAsk')+(o.name?' ('+o.name+')':'')),lk=(h,y)=>`<a class="lk" href="${h}" target="_blank" rel="noopener">${y}</a>`;let b='';
 if(ph)b+=lk('tel:'+ph,t('callShop'));if(wa)b+=lk('https://wa.me/'+wa+'?text='+mt,t('msgEta'));else if(ph)b+=lk('sms:'+ph+'?body='+mt,t('msgEta'));
 return x+(b?`<div class="cd" style="animation:none;text-align:center">${b}</div>`:'')}
function paint(){const o=lastO;if(!o)return;if(document.activeElement&&document.activeElement.id==='rc'){dirty=true;return}
 const home=o.type==='pickup'||o.type==='delivery',can=o.status=='cancelled',st=o.status=='new'?0:o.status=='accepted'?1:o.status=='ready'?2:3;
 const vs=o.status=='ready'?1:(o.status=='served'||o.status=='billed')?2:0,VF=['wait','ready','served'],VA=[1,1.304,1.837];
 $('#bd').innerHTML=(lastPend&&o.status=='new'&&navigator.onLine===false?`<div class="cd" style="margin-bottom:10px;background:#5a3b12;animation:none">${t('pend')}</div>`:'')+(can||home?'':`<div class="vh"><i class="bgi" style="background-image:url(${VF[vs]}.jpg)"></i><div class="fr" style="--a:${VA[vs]}"><video id="vv" src="${VF[vs]}.mp4" poster="${VF[vs]}.jpg" muted loop autoplay playsinline preload="auto"></video></div></div>`)+`<div style="text-align:center">${can?'<div class="ok">✕</div>':(home?`<div class="hero">${vs==0?'👨‍🍳':vs==1?(o.type==='pickup'?'🛍️':'🛵'):'✅'}</div>`:'')+`<span class="bdg">${t(home?'hvw':'vw')[vs]}</span>`}<h2 style="margin:6px 0">${can?t('sorry'):(vs==0?t('sent'):vs==1?t('vt')[1]:'❤')}</h2><div class="mu">${can?'':(vs==0?t('vt')[0]+'<br>':vs==2?t('vt')[2]+'<br>':(o.type==='pickup'?t('pkGo')+'<br>':o.type==='delivery'?t('dlGo')+'<br>':''))}${o.type==='delivery'?t('dl')+' · ':o.type==='pickup'?t('pk')+' · ':''}${o.table&&o.table!='-'?t('table')+esc(o.table)+' · ':''}${esc(o.name||'')}</div></div>
 ${can?'':`<div class="stp">${(home?t(o.type==='pickup'?'hpk':'hdl'):t('steps')).map((s,k)=>`<div class="${k<=st?'d':''}"><i>${k<=st?'✓':k+1}</i>${s}</div>`).join('')}</div>`}
 ${homeExtra(o,home,vs,can)}<div class="cd" style="animation:none">${o.items.map(x=>`<div class="row"><span>${esc(nmId(x))} × ${x.q}</span><b>${m(x.p*x.q)}</b></div>`).join('')}${o.fee?`<div class="row"><span>${t('fee')}</span><b>${m(o.fee)}</b></div>`:''}<div class="row" style="border-top:1px solid var(--ln)"><span><b>${t('total')}</b></span><b>${m(o.total)}</b></div></div>
 ${can||st<1?'':ratingHTML()}
 <p class="mu" style="text-align:center">${t('foot')}</p><button class="big" onclick="location.href='?s=${uid}${tbl?'&t='+encodeURIComponent(tbl):''}${HM?'&h=1':''}'">${t('more')}</button>`;
 const v=$('#vv');if(v){v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>{})}
 if(!can&&vs<2)lock();else unlock();
 const ck='cf'+oid+(home?'_'+vs:'');if(!sessionStorage.getItem(ck)&&!can){sessionStorage.setItem(ck,1);pop()}}
let wl=null;async function lock(){try{if(!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
function unlock(){try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&lastO&&oid&&['new','accepted','ready'].includes(lastO.status))lock()});
/* পার্টি পপার: স্ক্রিনের নিচের মাঝখান থেকে জরি ও কুচি */
const cv=$('#cfx'),cx=cv.getContext('2d'),CL=['#f5b52e','#e8472f','#2f8f8a','#7c3aed','#ff6fa5','#3aa0ff','#7fd13b'];let ps=[],run=0;
function pop(){const D=window.devicePixelRatio||1;cv.width=innerWidth*D;cv.height=innerHeight*D;const ox=cv.width/2,oy=cv.height-10*D;
 for(let i=0;i<150;i++){const a=-Math.PI/2+(Math.random()-.5)*1.25,v=(9+Math.random()*19)*D;ps.push({k:0,D,x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.4,w:(5+Math.random()*6)*D,h:(8+Math.random()*8)*D,c:CL[i%CL.length],f:Math.random()*6})}
 for(let i=0;i<30;i++){const a=-Math.PI/2+(Math.random()-.5)*1,v=(11+Math.random()*17)*D;ps.push({k:1,D,x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,L:(60+Math.random()*80)*D,c:CL[i%CL.length],f:Math.random()*6})}
 if(!run){run=1;requestAnimationFrame(draw)}}
function draw(){cx.clearRect(0,0,cv.width,cv.height);
 ps=ps.filter(p=>{const D=p.D;p.vy+=(p.k?.22:.45)*D;p.vx*=p.k?.975:.985;p.vy*=p.k?.975:.99;p.x+=p.vx;p.y+=p.vy;p.f+=.12;
  if(p.k){const n=14;let dx=-p.vx,dy=-p.vy;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;cx.beginPath();cx.moveTo(p.x,p.y);
   for(let j=1;j<=n;j++){const s=p.L*j/n,w=Math.sin(p.f+j*.7)*7*D*(j/n);cx.lineTo(p.x+dx*s-dy*w,p.y+dy*s+dx*w)}
   cx.strokeStyle=p.c;cx.lineWidth=4*D;cx.lineCap='round';cx.stroke()}
  else{p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.f));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
  return p.y<cv.height+150*D});
 if(ps.length)requestAnimationFrame(draw);else{run=0;cx.clearRect(0,0,cv.width,cv.height)}}
let lastPend=false,lastSig='';function track(){orderWatch(oid,(d,pend)=>{if(!d){if(!lastO)$('#bd').textContent=t('nf');return}const sg=JSON.stringify(d)+pend;if(sg===lastSig)return;lastSig=sg;lastO=d;lastPend=pend;paint()})}
addEventListener('online',()=>{if(oid&&lastO)paint()});addEventListener('offline',()=>{if(oid&&lastO)paint()});
init();
setInterval(()=>{if(oid&&lastO&&lastO.eta&&lastO.type!=='dine'&&lastO.status!=='served'&&lastO.status!=='billed')paint()},30000);
/* অফলাইন প্রস্তুতি: সার্ভিস ওয়ার্কার চালু করে Firebase ফাইল ও ভিডিও ক্যাশে রাখা */
const regSW=()=>{navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
 const B='https://www.gstatic.com/firebasejs/10.12.2/';['firebase-app.js','firebase-firestore.js','firebase-component.js','firebase-logger.js','firebase-util.js'].forEach(f=>fetch(B+f,{mode:'no-cors'}).catch(()=>{}));
 ['wait.mp4','ready.mp4','served.mp4','wait.jpg','ready.jpg','served.jpg','logo-192.png'].forEach(f=>fetch(f).catch(()=>{}))}).catch(()=>{})};
if('serviceWorker' in navigator){document.readyState==='complete'?regSW():addEventListener('load',regSW)}
