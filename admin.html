 if(d<0)return{k:'expired',l:'Expired '+(-d)+'d',c:'b',d};if(d<=30)return{k:'expiring',l:(s.st=='trial'?'Trial · ':'')+d+' days left',c:'w',d};return{k:s.st=='trial'?'trial':'active',l:(s.st=='trial'?'Trial · ':'Active · ')+d+' days',c:s.st=='trial'?'w':'ok',d}}

 L.sort((a,b)=>(a.r.sub?+a.r.sub.exp:1e15)-(b.r.sub?+b.r.sub.exp:1e15));
 return L.map(({r,s})=>{const sb=r.sub||{},nm=r.name||sb.nm||'Unnamed shop',pay=(sb.pay||[]).slice(-2).reverse().map(p=>fmt(p.t)+' · '+esc(p.a)+(p.m?' · '+esc(p.m):'')).join('  |  '),life=s.k=='life',pc=s.d==null||life?0:Math.max(3,Math.min(100,s.d/365*100));

/* ---- insights ---- */
function num(a){const m=String(a||'').replace(/[,\s]/g,'').match(/[\d.]+/);return m?parseFloat(m[0]):0}
function insH(){const pays=[];rows.forEach(r=>(r.sub&&r.sub.pay||[]).forEach(p=>pays.push(Object.assign({shop:em(r)||r.name||r.id},p))));
 const tot=pays.reduce((a,p)=>a+num(p.a),0),by={};pays.forEach(p=>{const k=new Date(p.t).toISOString().slice(0,7);by[k]=(by[k]||0)+num(p.a)});const ks=Object.keys(by).sort().slice(-8),mx=Math.max(1,...ks.map(k=>by[k]));
 const due=rows.map(r=>({r,s:stOf(r)})).filter(x=>x.s.d!=null&&x.s.d<=90&&x.s.d>=0&&x.s.k!='life').sort((a,b)=>a.s.d-b.s.d);
 return '<h2 class="pt">Insights</h2><div class="stats"><div class="st"><b>'+tot.toLocaleString()+'</b><span>Recorded payments</span></div><div class="st"><b>'+pays.length+'</b><span>Payments</span></div><div class="st"><b>'+due.length+'</b><span>Renewals ≤ 90d</span></div></div>'
 +'<div class="panel"><h3>Monthly receipts</h3><p class="s">From payments you recorded (numbers only are summed).</p>'+(ks.length?ks.map(k=>'<div class="mrow"><span>'+k+'</span><div class="bb"><i style="width:'+by[k]/mx*100+'%"></i></div><b>'+by[k].toLocaleString()+'</b></div>').join(''):'<div class="empty" style="padding:24px">No payments recorded yet.</div>')+'</div>'
 +'<div class="panel"><h3>Upcoming renewals</h3><p class="s">Shops whose plan ends within 90 days.</p>'+(due.map(x=>'<div class="mrow"><span style="width:auto;flex:1;color:var(--ink);word-break:break-all">'+esc(em(x.r)||x.r.name||x.r.sub.nm||x.r.id)+'</span><span style="width:auto">'+fmt(x.r.sub.exp)+'</span><b class="pill '+x.s.c+'" style="width:auto">'+x.s.d+'d</b></div>').join('')||'<div class="empty" style="padding:24px">Nothing due soon.</div>')+'</div>'}

function setPage(){const t=SETS.filter(s=>s[0]==pg)[0]||SETS[0],b='<button class="back" onclick="window.go(\'set\')">← Settings</button><h2 class="pt">'+t[1]+' '+t[2]+'</h2>',sv=(f)=>'<div class="act" style="margin-top:16px"><button class="pri" onclick="window.'+f+'()">Save</button></div>';
 if(pg=='set-contact')return b+'<div class="panel"><p class="s">Shown on the lock screen when a subscription ends.</p><label>Contact (WhatsApp number or text)</label><input id="c1" placeholder="+966 5x xxx xxxx" value="'+esc(cfg.contact||'')+'">'+sv('saveContact')+'</div>';
 if(pg=='set-price')return b+'<div class="panel"><p class="s">Yearly price is shown on the lock screen. Trial days apply to new sign-ups.</p><div class="g2"><div><label>Yearly price shown</label><input id="c2" placeholder="600 SAR / year" value="'+esc(cfg.price||'')+'"></div><div><label>Free trial (days, 1–15)</label><input id="c3" type="number" min="1" max="15" value="'+esc(cfg.trial||14)+'"></div></div>'+sv('savePriceTrial')+'</div>';
 if(pg=='set-brand')return b+'<div class="panel"><label>Software name</label><input id="c4" placeholder="Musafir POS" value="'+esc(cfg.brand||'')+'"><label>Message on lock screen (optional)</label><textarea id="c5" rows="3" placeholder="Your subscription has ended. Please renew to continue.">'+esc(cfg.msg||'')+'</textarea>'+sv('saveBrand')+'</div>';
 if(pg=='set-data')return b+'<div class="panel"><p class="s">Download every shop with email, plan, validity and notes.</p><div class="act"><button class="pri" onclick="window.csv()">Export CSV</button></div></div>';
 return b+'<div class="panel"><p class="s">Admin access is limited to <b style="color:var(--ink)">'+esc(ADMIN)+'</b> with a verified email, enforced by Firestore rules.</p></div>'}
async function put(id,patch){const r=rows.find(x=>x.id==id);const cur=r.sub||{};const nx=Object.assign({email:em(r),nm:r.name||'',t0:Date.now(),st:'active'},cur,patch);await setDoc(doc(db,'subs',id),nx);r.sub=nx}
const run=async f=>{try{await f();draw();toast('Saved')}catch(e){toast('Failed: '+(e.code||e.message))}};
const saveCfg=async p=>{cfg=Object.assign({},cfg,p);await setDoc(doc(db,'appcfg','main'),cfg)};
window.go=p=>{pg=p;draw();scrollTo(0,0)};window.sb=()=>{$('#side').classList.toggle('open');$('#scrim').classList.toggle('on')};

async function chg(id,patch,what){const r=rows.find(x=>x.id==id),s=r.sub,h=((s&&s.hist)||[]).slice(-9),
  f=s&&s.exp?{exp:+s.exp,st:s.st||'active',plan:s.plan||''}:null,to={exp:'exp' in patch?patch.exp:(f?f.exp:0),st:'st' in patch?patch.st:(f?f.st:'active'),plan:'plan' in patch?patch.plan:(f?f.plan:'')};
 h.push({t:Date.now(),w:what,f,to});await put(id,Object.assign({},patch,{hist:h}))}
window.ext=(id,m)=>run(async()=>{const r=rows.find(x=>x.id==id),b=r.sub&&r.sub.st!='suspended'&&!isLife(r.sub.exp)?+r.sub.exp:0;await chg(id,{exp:addM(b,m),st:'active',plan:m==1?'m1':m==6?'m6':'y1'},'Extend +'+(m==12?'1 Year':m+(m==1?' Month':' Months')))});

window.trial=id=>{if(confirm('Set a '+(cfg.trial||14)+'-day trial from today?'))run(()=>chg(id,{exp:Date.now()+(+cfg.trial||14)*DAY,st:'trial',plan:'trial'},'Trial from today'))};

const PN={trial:'Free trial',m1:'1 Month',m6:'6 Months',y1:'1 Year',life:'Lifetime'},MN={set:'From today',add:'Add to current',sub:'Subtract',date:'Exact date'};
let PM=null;

function lastH(r){const h=r.sub&&r.sub.hist,e=h&&h[h.length-1];if(!e)return '';const d=new Date(e.t);
 return '<div class="lastc"><span>Last change · '+d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+' · <b style="color:var(--ink)">'+esc(e.w||'')+'</b> · '+(e.f?stS(e.f):'No plan')+' → '+stS(e.to)+'</span>'+(e.f?'<button onclick="window.undo(\''+r.id+'\')">Undo</button>':'')+'</div>'}
function pmCalc(){const r=rows.find(x=>x.id==PM.id),s=r.sub,cur=s&&s.exp&&!isLife(s.exp)?+s.exp:null,pl=PM.plan,now=Date.now();
 if(pl=='life')return{exp:LIFE,st:'active',plan:'life'};
 if(PM.mode=='date'){if(!PM.date)return{err:'Pick a date'};const p=PM.date.split('-').map(Number),t=new Date(p[0],p[1]-1,p[2],23,59,59).getTime();if(!(t>0)||p[0]>2100)return{err:'Invalid date'};return{exp:t,st:pl=='trial'?'trial':'active',plan:pl}}
 if(PM.mode!='set'&&cur==null)return{err:'This shop has no end date to '+(PM.mode=='add'?'add to':'subtract from')+'. Use "From today" or "Exact date".'};
 const base=PM.mode=='set'?now:cur,sg=PM.mode=='sub'?-1:1,mm={m1:1,m6:6,y1:12}[pl],exp=pl=='trial'?base+sg*(+cfg.trial||14)*DAY:addMon(base,sg*mm);

function pmV(){const r=rows.find(x=>x.id==PM.id),s=r.sub,c=pmCalc(),now=Date.now(),cur=s&&s.exp?stS({exp:s.exp,st:s.st}):'No plan',curL=s?stOf(r).l:'';
 let pv;if(c.err)pv='<div class="prev bad">'+esc(c.err)+'</div>';else{const d=Math.ceil((c.exp-now)/DAY),past=c.plan!='life'&&c.exp<now;
  pv='<div class="prev'+(past?' bad':'')+'"><div>Now: <b>'+esc(cur)+'</b>'+(curL&&!isLife(s&&s.exp)?' <span style="opacity:.7">('+esc(curL)+')</span>':'')+'</div><div>New: <b>'+(c.plan=='life'?'Lifetime':fmt(c.exp))+'</b> · '+PN[c.plan]+(c.plan=='life'?'':' <span style="opacity:.7">('+(past?'already expired — shop will be locked':d+' days from today')+')</span>')+'</div>'+(s&&s.st=='suspended'?'<div style="font-size:12.5px">This account is suspended — it will be activated.</div>':'')+'</div>'}

function pmDraw(){const r=rows.find(x=>x.id==PM.id),s=r.sub,noCur=!(s&&s.exp&&!isLife(s.exp));
 $('#pmb').innerHTML='<h3>Change plan</h3><p class="sub2">'+esc(em(r)||r.name||r.id)+'</p><h5>1 · Plan</h5><div class="seg">'+Object.keys(PN).map(k=>'<button class="'+(PM.plan==k?'on':'')+'" onclick="window.pmS(\'plan\',\''+k+'\')">'+PN[k]+'</button>').join('')+'</div>'
 +(PM.plan=='life'?'':'<h5>2 · How</h5><div class="seg">'+['set','add','sub','date'].map(k=>'<button '+((k=='add'||k=='sub')&&noCur?'disabled ':'')+'class="'+(PM.mode==k?'on':'')+'" onclick="window.pmS(\'mode\',\''+k+'\')">'+MN[k]+'</button>').join('')+'</div><div class="hint">'+({set:'Old date is replaced. The new period starts today.',add:'New period is added after the current end date.',sub:'Removes the period from the current end date (use to correct a mistake).',date:'Choose the exact last day of the subscription.'}[PM.mode])+'</div>'
 +(PM.mode=='date'?'<input type="date" id="pmd" value="'+esc(PM.date||'')+'" oninput="window.pmS(\'date\',this.value)" style="margin-top:8px">':''))
 +'<div id="pmv">'+pmV()+'</div>'}

 let o=$('#pmo');if(!o){o=document.createElement('div');o.id='pmo';o.className='mo';o.innerHTML='<div class="mb" id="pmb"></div>';o.addEventListener('mousedown',e=>{if(e.target===o)window.pmX()});document.body.appendChild(o)}o.style.display='flex';pmDraw()};
